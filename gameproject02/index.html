<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SCRAP BLITZ - Phase 2.2</title>
  <style>
    /* === HUD デザイントークン（仕様書 §22）===
       全 HUD の px 値はこの :root 変数を参照する。
       トーン調整（HUD全体を 1.2倍に絞る等）は変数1箇所で完結。 */
    :root {
      --fs-xs:  15px;  /* 補足テキスト */
      --fs-sm:  18px;  /* 標準 HUD */
      --fs-md:  21px;  /* 中サイズ（DUMMY HP 等）*/
      --fs-lg:  27px;  /* サブラベル（COMBO）*/
      --fs-xl:  54px;  /* 中盛り見出し */
      --fs-xxl: 96px;  /* 大数字（コンボ数字）*/

      --sp-xs:  6px;   /* 細余白 */
      --sp-sm:  9px;   /* 内側余白・小 */
      --sp-md:  12px;  /* 内側余白・中 */
      --sp-lg:  18px;  /* 外側余白（HUD端）*/
      --sp-xl:  90px;  /* 大外側オフセット */

      --hud-accent-w: 5px;   /* アクセントボーダー幅 */
      --ls-tight:     1.5px; /* letter-spacing 標準 */
      --ls-wide:      3px;   /* letter-spacing 強調 */
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
      color: #00ddff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* === 16:9 固定ゲームフレーム（基本解像度 1920x1080）===
       ウィンドウサイズに応じてレターボックスでスケーリング。
       HUD・Canvas はすべてこの中に内包される。 */
    #game-frame {
      position: relative;
      width:  min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #0a0a1f;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    /* === HUD レイヤー：1920x1080 デザイン空間で全 HUD を配置し、
       transform: scale() でゲームフレームに合わせて等倍スケーリング ===
       JS が --hud-scale を更新（解像度スケール追従） */
    #hud-layer {
      position: absolute;
      top: 0; left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      transform: scale(var(--hud-scale, 1));
      pointer-events: none;
      z-index: 10;
    }

    /* === 個別 HUD 要素 ===
       基本解像度（1920x1080）で 1.5x サイズ。
       hud-layer の transform: scale() で window スケールに自動追従する */
    #hud {
      position: absolute;
      top: var(--sp-lg); left: var(--sp-lg);
      padding: var(--sp-md) var(--fs-md);
      background: rgba(0, 20, 40, 0.55);
      border-left: var(--hud-accent-w) solid #00ddff;
      font-size: var(--fs-sm);
      letter-spacing: var(--ls-tight);
      pointer-events: none;
    }
    #hud .title {
      color: #ff00aa;
      font-weight: bold;
      letter-spacing: var(--ls-wide);
      margin-bottom: var(--sp-xs);
    }
    #hud .small { color: #88aacc; font-size: var(--fs-xs); }
    #hud .hk-active {
      color: #ffff44;
      background: rgba(255, 255, 0, 0.15);
      border-radius: 3px;
      padding-left: 6px;
      margin-left: -6px;
      text-shadow: 0 0 8px #ffaa00;
    }
    /* トグル系デバッグ機能（ON状態を緑で常時表示） */
    #hud .hk-toggle-on {
      color: #44ff88;
      background: rgba(0, 255, 100, 0.12);
      border-radius: 3px;
      padding-left: 6px;
      margin-left: -6px;
      text-shadow: 0 0 6px #00ff66;
    }

    #debug {
      position: absolute;
      bottom: var(--sp-lg); left: var(--sp-lg);
      padding: var(--sp-sm) var(--fs-xs);
      background: rgba(0, 0, 0, 0.5);
      font-size: var(--fs-sm);
      color: #88ff88;
      pointer-events: none;
    }

    #phase {
      position: absolute;
      top: var(--sp-lg); right: var(--sp-lg);
      padding: var(--sp-sm) var(--sp-lg);
      background: rgba(40, 0, 40, 0.55);
      border-right: var(--hud-accent-w) solid #ff00aa;
      font-size: var(--fs-sm);
      color: #ff88cc;
      pointer-events: none;
    }

    #sp-gauge-wrap {
      position: absolute;
      bottom: var(--sp-xl); left: var(--sp-lg);
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      pointer-events: none;
    }
    #sp-label {
      font-family: 'Courier New', monospace;
      font-size: var(--fs-sm);
      color: #00ddff;
      letter-spacing: var(--ls-wide);
      width: 33px;
    }
    #sp-bar-bg {
      width: 210px;
      height: var(--sp-md);
      background: rgba(0, 30, 60, 0.7);
      border: 2px solid #006688;
      border-radius: 3px;
      overflow: hidden;
    }
    #sp-bar {
      height: 100%;
      width: 100%;
      background: #00ddff;
      border-radius: 3px;
      transition: width 0.05s linear, background 0.1s linear;
    }
  </style>
</head>
<body>
  <div id="game-frame">
  <div id="hud-layer">
  <div id="hud">
    <div class="title">SCRAP BLITZ</div>
    <div id="hk-move">WASD / 矢印キー: 移動</div>
    <div id="hk-jump">SPACE / A: ジャンプ</div>
    <div id="hk-weak">J / □: 弱攻撃（連打で3段）</div>
    <div id="hk-strong">K / △: 強攻撃</div>
    <div id="hk-cancel">ヒット中SPACE: キャンセルジャンプ</div>
    <div id="hk-secondary">L / L1: セカンダリ</div>
    <div id="hk-mega">U / R1: メガクラッシュ</div>
    <div id="hk-ult">I / R2: ULT（超必殺技）</div>
    <div id="hk-hitbox" class="small">Q: ヒットボックス / コリジョン [OFF]</div>
    <div class="small">Phase 2.2 — KB+Pad対応</div>
  </div>

  <div id="debug">x: 0  z: 0  y: 0</div>
  <div id="phase">PHASE 2.2: SP / STRONG / DASH</div>

  <div id="combo" style="
    position: absolute;
    top: 50%; right: var(--sp-xl);
    transform: translateY(-50%);
    font-family: 'Courier New', monospace;
    font-size: var(--fs-xl);
    color: #ffff44;
    text-shadow: 0 0 var(--sp-lg) #ff8800, 3px 3px 0 #000;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    text-align: right;
  ">
    <div id="combo-num" style="font-size: var(--fs-xxl); line-height: 1;">0</div>
    <div id="combo-label" style="font-size: var(--fs-lg); color: #ffaa44;">COMBO</div>
  </div>

  <div id="sp-gauge-wrap">
    <div id="sp-label">SP</div>
    <div id="sp-bar-bg"><div id="sp-bar"></div></div>
  </div>

  <div id="dummy-hp" style="
    position: absolute;
    bottom: var(--sp-xl); right: var(--sp-xl);
    font-family: 'Courier New', monospace;
    font-size: var(--fs-md);
    color: #ff8888;
    background: rgba(40, 0, 0, 0.5);
    padding: var(--sp-sm) var(--sp-lg);
    border-right: var(--hud-accent-w) solid #ff4444;
    pointer-events: none;
  ">DUMMY HP: <span id="dummy-hp-num">100</span></div>
  </div><!-- /#hud-layer -->
  </div><!-- /#game-frame -->

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ============================================================
    //  SCENE / CAMERA / RENDERER
    // ============================================================
    // === 基本解像度（仕様書 §技術: 16:9 固定）===
    const GAME_WIDTH  = 1920;
    const GAME_HEIGHT = 1080;
    const GAME_ASPECT = GAME_WIDTH / GAME_HEIGHT;  // 16/9

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1f);
    scene.fog = new THREE.Fog(0x0a0a1f, 1400, 3500);

    const camera = new THREE.PerspectiveCamera(
      45,
      GAME_ASPECT,
      1,
      5000
    );
    // Plan: (0, 800, 600) → (0, 0, 0) を見る
    camera.position.set(0, 800, 600);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    // 内部レンダリング解像度は 1920x1080 固定。表示サイズは CSS が制御
    renderer.setSize(GAME_WIDTH, GAME_HEIGHT, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('game-frame').appendChild(renderer.domElement);

    // ============================================================
    //  LIGHTING (key + fill + rim accent)
    // ============================================================
    const ambient = new THREE.AmbientLight(0x4455aa, 0.4);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
    keyLight.position.set(500, 1200, 400);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left   = -1500;
    keyLight.shadow.camera.right  =  1500;
    keyLight.shadow.camera.top    =  1500;
    keyLight.shadow.camera.bottom = -1500;
    keyLight.shadow.camera.near = 100;
    keyLight.shadow.camera.far  = 3500;
    scene.add(keyLight);

    // Rim light でメカに紫の差し色
    const rimLight = new THREE.DirectionalLight(0xff44aa, 0.55);
    rimLight.position.set(-500, 400, -500);
    scene.add(rimLight);

    // 弱フィル（青）
    const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
    fillLight.position.set(0, 200, 800);
    scene.add(fillLight);

    // ============================================================
    //  PROCEDURAL GRID TEXTURE (ピクセル風)
    // ============================================================
    function makeGridTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 64;
      const ctx = canvas.getContext('2d');

      // ベース
      ctx.fillStyle = '#161628';
      ctx.fillRect(0, 0, 64, 64);

      // 格子線
      ctx.strokeStyle = '#26264a';
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 0, 64, 64);

      // ピクセルアクセント（中央に小ブロック）
      ctx.fillStyle = '#3a3a72';
      ctx.fillRect(28, 28, 8, 8);

      // コーナーノイズ
      ctx.fillStyle = '#1f1f3a';
      ctx.fillRect(2, 2, 4, 4);
      ctx.fillRect(58, 58, 4, 4);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.magFilter = THREE.NearestFilter; // ピクセル感維持
      tex.minFilter = THREE.NearestFilter;
      tex.repeat.set(80, 30);
      return tex;
    }

    // ============================================================
    //  GROUND PLANE
    // ============================================================
    const groundGeom = new THREE.PlaneGeometry(12000, 2400);
    const groundMat = new THREE.MeshToonMaterial({
      map:   makeGridTexture(),
      color: 0xaaaadd,
    });
    const ground = new THREE.Mesh(groundGeom, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    // ============================================================
    //  BACKGROUND PILLARS (奥行き演出・チープ感回避)
    // ============================================================
    function buildBackgroundElements() {
      const group = new THREE.Group();
      const pillarMat = new THREE.MeshToonMaterial({ color: 0x1a1a35 });

      for (let i = -5000; i <= 5000; i += 800) {
        const h = 600 + Math.random() * 800;
        const w = 200 + Math.random() * 200;
        const pillar = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, 200),
          pillarMat
        );
        pillar.position.set(i + (Math.random() - 0.5) * 200, h / 2, -1100);
        group.add(pillar);

        // ネオンアクセント（小さな箱）
        const neon = new THREE.Mesh(
          new THREE.BoxGeometry(w * 0.3, 30, 10),
          new THREE.MeshBasicMaterial({
            color: Math.random() > 0.5 ? 0x00ddff : 0xff00aa
          })
        );
        neon.position.set(pillar.position.x, h * 0.7, -1000);
        group.add(neon);
      }

      return group;
    }
    scene.add(buildBackgroundElements());

    // ============================================================
    //  ASSET ABSTRACTION LAYER (将来 GLTF 差し替え対応)
    //  Plan §技術スタック §アセット抽象化レイヤー
    // ============================================================
    function buildPlayerMesh() {
      const group = new THREE.Group();

      const bodyMat   = new THREE.MeshToonMaterial({ color: 0x00ccff });
      const accentMat = new THREE.MeshToonMaterial({ color: 0xff2288 });
      const dimMat    = new THREE.MeshToonMaterial({ color: 0x335577 });

      // 胴体
      const torso = new THREE.Mesh(
        new THREE.BoxGeometry(70, 90, 55),
        bodyMat
      );
      torso.position.y = 100;
      torso.castShadow = true;
      group.add(torso);

      // 胸プレート（差し色）
      const chest = new THREE.Mesh(
        new THREE.BoxGeometry(50, 30, 5),
        accentMat
      );
      chest.position.set(0, 110, 28);
      group.add(chest);

      // 頭部
      const head = new THREE.Mesh(
        new THREE.BoxGeometry(45, 40, 42),
        dimMat
      );
      head.position.y = 165;
      head.castShadow = true;
      group.add(head);

      // バイザー
      const visor = new THREE.Mesh(
        new THREE.BoxGeometry(38, 8, 5),
        new THREE.MeshBasicMaterial({ color: 0x00ffff })
      );
      visor.position.set(0, 168, 21);
      group.add(visor);

      // 肩
      const shoulderGeom = new THREE.BoxGeometry(28, 28, 28);
      const shoulderL = new THREE.Mesh(shoulderGeom, accentMat);
      shoulderL.position.set(-50, 130, 0);
      shoulderL.castShadow = true;
      group.add(shoulderL);
      const shoulderR = shoulderL.clone();
      shoulderR.position.x = 50;
      group.add(shoulderR);

      // 腕（円柱）
      const armGeom = new THREE.CylinderGeometry(13, 15, 75, 8);
      const armL = new THREE.Mesh(armGeom, bodyMat);
      armL.position.set(-50, 90, 0);
      armL.castShadow = true;
      group.add(armL);
      const armR = armL.clone();
      armR.position.x = 50;
      group.add(armR);

      // 拳
      const fistGeom = new THREE.BoxGeometry(22, 22, 22);
      const fistL = new THREE.Mesh(fistGeom, dimMat);
      fistL.position.set(-50, 50, 0);
      fistL.castShadow = true;
      group.add(fistL);
      const fistR = fistL.clone();
      fistR.position.x = 50;
      group.add(fistR);

      // 脚
      const legGeom = new THREE.CylinderGeometry(16, 22, 65, 8);
      const legL = new THREE.Mesh(legGeom, bodyMat);
      legL.position.set(-22, 35, 0);
      legL.castShadow = true;
      group.add(legL);
      const legR = legL.clone();
      legR.position.x = 22;
      group.add(legR);

      // 足
      const footGeom = new THREE.BoxGeometry(28, 12, 38);
      const footL = new THREE.Mesh(footGeom, dimMat);
      footL.position.set(-22, 6, 5);
      footL.castShadow = true;
      group.add(footL);
      const footR = footL.clone();
      footR.position.x = 22;
      group.add(footR);

      // ブースター噴射（足元の下に伸びる円錐）
      const thrusterMat = new THREE.MeshBasicMaterial({
        color: 0x00ddff,
        transparent: true,
        opacity: 0.85,
      });
      const thrusterGeom = new THREE.ConeGeometry(9, 35, 6);
      const thrusterL = new THREE.Mesh(thrusterGeom, thrusterMat);
      thrusterL.position.set(-22, -18, 5);
      thrusterL.rotation.x = Math.PI;  // 下向き
      thrusterL.visible = false;
      group.add(thrusterL);
      const thrusterR = thrusterL.clone();
      thrusterR.material = thrusterMat;  // 共有
      thrusterR.position.x = 22;
      group.add(thrusterR);

      // 肩のヨースラスター（方向転換時の姿勢制御推力・板野的「動きに理屈」）
      const yawMat = new THREE.MeshBasicMaterial({
        color: 0xff66cc,
        transparent: true,
        opacity: 0.9,
      });
      const yawGeom = new THREE.ConeGeometry(6, 22, 6);
      const yawL = new THREE.Mesh(yawGeom, yawMat);
      yawL.position.set(-68, 130, 0);
      yawL.rotation.z = Math.PI / 2;   // -X 方向に噴射
      yawL.visible = false;
      group.add(yawL);
      const yawR = yawL.clone();
      yawR.material = yawMat;
      yawR.position.set(68, 130, 0);
      yawR.rotation.z = -Math.PI / 2;  // +X 方向に噴射
      yawR.visible = false;
      group.add(yawR);

      // 参照を保持しておく（アニメーション・エフェクト制御用）
      group.userData.parts = {
        torso, head, armL, armR, legL, legR, footL, footR, visor,
        thrusterL, thrusterR,
        yawL, yawR,
      };

      return group;
    }

    const CHARACTER_ASSETS = {
      player_viper: {
        type: 'procedural',
        path: null,
        buildFn: buildPlayerMesh,
      },
      // 将来追加例:
      // enemy_scrapper: { type: 'procedural', buildFn: buildScrapperMesh },
      // player_viper_v2: { type: 'gltf', path: './assets/player.glb' },
    };

    async function loadCharacterModel(key) {
      const asset = CHARACTER_ASSETS[key];
      if (!asset) throw new Error(`Asset key not found: ${key}`);
      if (asset.type === 'gltf') {
        // 将来：GLTFLoader で読み込み
        throw new Error('GLTF loader not yet implemented in Phase 1');
      } else {
        return asset.buildFn();
      }
    }

    // ============================================================
    //  PHYSICS / TUNING （ランタイムで変更可能）
    //  コンソール: window.SB.PHYSICS.JUMP_V = 12   などで即反映
    // ============================================================
    const PHYSICS = {
      SPEED:            5.5,    // 水平移動速度
      JUMP_V:           10,     // ジャンプ初速（小さめ＝重量感）
      THRUST_FORCE:     1.20,   // ブースター毎フレーム加速量
      THRUST_FRAMES:    12,     // ブースター持続フレーム数（最大）
      GRAVITY:          0.96,   // 重力加速度
      YAW_BURST_FRAMES: 9,      // 方向転換時の肩スラスター噴射時間

      // === 攻撃・コンボ系 ===
      // キャンセルジャンプ時の噴射（板野的ケレン味）
      // 通常ジャンプ: JUMP_V=10, THRUST=1.20, FRAMES=12 → 最大vy=24.4
      // キャンセル時:                                  → 最大vy=30.2（24%増）
      // 視覚演出（bigBurstTimer）でケレン味を出し、物理は通常+α 程度に抑える
      CANCEL_JUMP_V:        12,    // キャンセル時のジャンプ初速（通常+2）
      CANCEL_JUMP_THRUST:   1.3,   // キャンセル時の推力（通常+0.1）
      CANCEL_JUMP_FRAMES:   14,    // キャンセル時の推力持続（通常+2）
      AERIAL_HOP_V:          7,    // 空中Jコンボ開始時に付与する上昇速度（滞空維持）

      // === ステージ横バウンド ===
      // プレイヤーがこの範囲外に出られないようにクランプ。
      // 横に無限に広がらないための制約（仕様書 §技術 / §7 ステージ構成）。
      // 値はランタイムで SB.PHYSICS.STAGE_LEFT = -2000 等で即変更可。
      STAGE_LEFT:   -1500,
      STAGE_RIGHT:   1500,

      // === ダッシュ（ローラーダッシュ式：2回タップ＋押しっぱなしで無制限持続） ===
      DASH_SPEED_MULT:  2.5,  // 通常速度の倍率
      DASH_COOLDOWN:    24,   // ダッシュ終了後の再発動クールダウン（フレーム）
      DASH_TAP_WINDOW:  12,   // 同方向2回タップの受付ウィンドウ（フレーム）
      DASH_SPARK_ANGLE: Math.PI / 6, // 足元火花を出す方向変化の閾値（30°）

      // === 空中慣性 ===
      AIR_FRICTION:  0.90,  // 空中の水平速度減衰率（毎フレーム）
      AIR_CONTROL:   1.2,   // 空中での方向修正力（SPEED より小さく・空中は足場がない）
    };

    // ============================================================
    //  SP ゲージ設定
    // ============================================================
    const SP_CONFIG = {
      MAX:              100,
      REGEN_RATE:       0.01,  // フレームごとの自然回復量（攻撃優先設計：逃げ回りだけでは遅い）
      GAIN_ON_HIT:      8,     // ヒット1発あたりの獲得量
      MEGA_CRASH_COST:  20,    // メガクラッシュ消費（= 1 LEVEL / MAX5換算）
      ULT_COST:         40,    // ULT消費（= 2 LEVEL / MAX5換算）
    };

    // ============================================================
    //  攻撃データテーブル（弱攻撃3段チェーン）
    //  Plan §2 戦闘システム §キャンセルシステム
    //  値はランタイムで SB.ATTACKS.z1.damage = ... のように調整可能
    // ============================================================
    const ATTACKS = {
      z1: {
        label:        'Z1 (左ジャブ)',
        duration:     16, hitFrame: 6, hitDuration: 4, cancelWindow: 14,
        damage:       6,
        rangeX:       95, rangeZ: 70,
        knockback:    6, hitstop: 3, shake: 2,
        partsAnim:    'punch_l',
      },

    // ============================================================
    //  攻撃属性テーブル（特殊挙動バンドルの定義）
    //  技の attrGroup フィールドで参照する。
    //  個別フィールドが attrGroup と重複する場合は個別フィールドが優先。
    // ============================================================
    const ATTACK_ATTRS = {
      // 打ち上げコンボ：敵を垂直に浮かせ→頂点でスロー→キャンセルジャンプで追撃
      LAUNCH_COMBO: {
        launcher:  true,   // プレイヤーのキャンセルジャンプ許可
        peakHang:  true,   // 敵が頂点付近でスロー（「今がチャンス」演出）
      },
      // ─── 将来の属性枠組み ──────────────────────────────────────
      // SLAM:        { slamWave: true },             // 叩きつけ → 地面衝撃波
      // GUARD_BREAK: { breakGuard: true },           // ガードブレイク
      // FIRE_DOT:    { dot: true, element: 'fire' }, // 燃焼DoT（METEO属性）
    };

    // attrGroup を解決して実効フラグを返す（個別フィールドが優先）
    function resolveAttackAttr(attack) {
      if (!attack.attrGroup) return attack;
      return Object.assign({}, ATTACK_ATTRS[attack.attrGroup] ?? {}, attack);
    }

    // 地上 J チェーン：z1 → z2 → z3 → z4（K は単独・チェーン外）
    const Z_CHAIN = ['z1', 'z2', 'z3', 'z4'];
    // 空中 J チェーン：a1 → a2 → a3（ジャンプ中 or キャンセルジャンプ後）
    const A_CHAIN = ['a1', 'a2', 'a3'];

    // プレイヤー状態
    const STATE = {
      IDLE:        'idle',
      ATTACKING:   'attacking',     // 攻撃モーション中
      HIT_CONFIRM: 'hit_confirm',   // ヒット確認後のキャンセル受付中
    };

    // ============================================================
    //  PLAYER STATE (将来マルチ対応のため配列管理)
    //  Plan §注意事項
    // ============================================================
    const players = [];

    const playerMesh = await loadCharacterModel('player_viper');
    scene.add(playerMesh);

    const player = {
      mesh:             playerMesh,
      x: 0, y: 0, z: 0,
      vy:               0,
      isGrounded:       true,
      facing:           1,   // 1 = 右向き, -1 = 左向き
      bobPhase:         0,   // 待機時の上下バウンス用
      thrustFramesLeft: 0,   // ブースター残量（フレーム数）
      yawBurstTimer:    0,   // ヨースラスター残時間
      yawBurstSide:     0,   // -1=左肩 / +1=右肩 が噴射中
      prevMoveDir:      0,   // 前フレームの水平移動方向（-1/0/+1）

      // === 戦闘ステート ===
      state:            STATE.IDLE,
      stateTimer:       0,    // 現在ステートの残フレーム
      attackId:         null, // 現在の攻撃ID（z1/z2/z3）
      attackChainIdx:   -1,   // チェーンの何段目か
      attackChainArr:   null, // 実行中チェーン配列（Z_CHAIN / A_CHAIN）
      hitDelivered:     false,// 現攻撃でヒット成立済みか
      cancelTimer:      0,    // キャンセル受付残フレーム
      bigBurstTimer:    0,    // キャンセルジャンプの大噴射演出残時間
      attackBuffered:   false,// 攻撃中に J が押されたバッファ
      kBuffered:        false,// 攻撃中に K が押されたバッファ
      kBufferUp:        false,// バッファ時の ↑ 入力状態（打ち上げ判定用）
      aerialWhiffed:    false,// 空中J空振り中フラグ（着地でリセット）

      // === SP ゲージ ===
      sp:               0,

      // === 空中慣性 ===
      airVx:            0,        // 空中水平慣性 X（ダッシュジャンプの勢い）
      airVz:            0,        // 空中水平慣性 Z

      // === ダッシュ（ローラーダッシュ） ===
      dashCooldown:     0,
      dashActive:       false,    // ローラーダッシュ継続中フラグ
      dashTriggerDx:    0,        // ダッシュ発動キーの方向 X
      dashTriggerDz:    0,        // ダッシュ発動キーの方向 Z
      dashDirX:         0,        // 現フレームの移動方向 X（斜め時に更新）
      dashDirZ:         0,        // 現フレームの移動方向 Z
      lastTapDir:       null,     // 最後タップ方向 { x, z }
      lastTapTimer:     0,        // 最後タップからの経過受付フレーム
      dashSparkColor:   0xff9900, // 軸変更火花色（METEO=オレンジ）
    };
    players.push(player);

    // ============================================================
    //  HITSTOP / SHAKE 機構（プランの共通関数）
    // ============================================================
    let hitstopTimer  = 0;
    let shakeTimer    = 0;
    let shakeStrength = 0;
    let shakeOffsetX  = 0;
    let shakeOffsetY  = 0;

    function triggerHitstop(frames) {
      if (frames > hitstopTimer) hitstopTimer = frames;
    }
    function triggerShake(strength, frames) {
      if (strength > shakeStrength) shakeStrength = strength;
      if (frames > shakeTimer) shakeTimer = frames;
    }

    // ============================================================
    //  PARTICLE SYSTEM（ヒット時の火花）
    // ============================================================
    const particles = [];

    function spawnHitParticles(x, y, z, color = 0xffee44, count = 10) {
      const geom = new THREE.BoxGeometry(7, 7, 7);
      for (let i = 0; i < count; i++) {
        const mat = new THREE.MeshBasicMaterial({ color });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.set(x, y, z);
        scene.add(mesh);
        particles.push({
          mesh,
          vx: (Math.random() - 0.5) * 14,
          vy: 4 + Math.random() * 10,
          vz: (Math.random() - 0.5) * 14,
          life: 22 + Math.random() * 10,
        });
      }
    }

    // 打ち上げヒット時の足元から吹き上がる土煙エフェクト
    function spawnLaunchSmoke(x, y, z) {
      const count = 30;
      for (let i = 0; i < count; i++) {
        const col = Math.random() > 0.5 ? 0xeedd99 : 0xfff4cc; // 土埃・砂煙
        const size = 12 + Math.random() * 10;
        const geom = new THREE.BoxGeometry(size, size, size);
        const mat  = new THREE.MeshBasicMaterial({ color: col });
        const mesh = new THREE.Mesh(geom, mat);
        // 足元から少し散らしてスポーン
        mesh.position.set(
          x + (Math.random() - 0.5) * 50,
          y + Math.random() * 20,
          z + (Math.random() - 0.5) * 25
        );
        scene.add(mesh);
        particles.push({
          mesh,
          vx: (Math.random() - 0.5) * 5,
          vy: 12 + Math.random() * 18,  // 強い上方向
          vz: (Math.random() - 0.5) * 5,
          life: 32 + Math.random() * 14,
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.mesh.position.x += p.vx;
        p.mesh.position.y += p.vy;
        p.mesh.position.z += p.vz;
        p.vy -= 0.7;
        p.life--;
        const lifeRatio = Math.max(0, p.life / 22);
        p.mesh.scale.setScalar(lifeRatio);
        if (p.life <= 0 || p.mesh.position.y < 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }
    }

    // ============================================================
    //  DUMMY ENEMY（攻撃対象）
    // ============================================================
    function buildDummyMesh() {
      const group = new THREE.Group();
      const baseMat = new THREE.MeshToonMaterial({ color: 0x884444 });
      const accentMat = new THREE.MeshToonMaterial({ color: 0xddaa44 });

      // 胴体（やや大きめ）
      const body = new THREE.Mesh(new THREE.BoxGeometry(70, 130, 60), baseMat);
      body.position.y = 80;
      body.castShadow = true;
      group.add(body);

      // 頭
      const head = new THREE.Mesh(new THREE.BoxGeometry(45, 40, 40), accentMat);
      head.position.y = 165;
      head.castShadow = true;
      group.add(head);

      // 脚（一体化した台座風）
      const stand = new THREE.Mesh(new THREE.BoxGeometry(60, 30, 60), accentMat);
      stand.position.y = 15;
      stand.castShadow = true;
      group.add(stand);

      group.userData.parts = { body, head, stand };
      return group;
    }

    const enemies = [];
    const dummyMesh = buildDummyMesh();
    dummyMesh.position.set(280, 0, 0);
    scene.add(dummyMesh);

    const dummy = {
      mesh:           dummyMesh,
      x: 280, y: 0, z: 0,
      hp:             100,
      maxHp:          100,
      hitFlashTimer:  0,
      knockbackVx:    0,
      knockbackVz:    0,
      vy:               0,     // 垂直速度（打ち上げ用）
      prevVy:           0,     // 前フレームの垂直速度（頂点検出用）
      peakHangTimer:    0,     // 打ち上げ頂点スロー残フレーム
      peakHangTotal:    0,     // スロー総フレーム数（フェード計算用）
      launcherAirborne: false, // LAUNCH_COMBO 属性で打ち上げられた状態か
      isAlive:          true,
    };
    enemies.push(dummy);

    // ============================================================
    //  COMBO COUNTER
    // ============================================================
    const combo = {
      count:       0,
      decayTimer:  0,
      decayMax:    90,  // 90F = 1.5秒で消失
    };
    const comboEl     = document.getElementById('combo');
    const comboNumEl  = document.getElementById('combo-num');
    const dummyHpEl   = document.getElementById('dummy-hp-num');

    function bumpCombo() {
      combo.count += 1;
      combo.decayTimer = combo.decayMax;
      comboEl.style.opacity = '1';
      comboNumEl.textContent = combo.count;
      // 段階別の色変化
      if (combo.count >= 30)      comboNumEl.style.color = '#ff44ff';
      else if (combo.count >= 20) comboNumEl.style.color = '#ff8800';
      else if (combo.count >= 10) comboNumEl.style.color = '#ffff44';
      else                        comboNumEl.style.color = '#ffffff';
      // ポップアニメ
      comboNumEl.style.transform = 'scale(1.3)';
      setTimeout(() => { comboNumEl.style.transform = 'scale(1)'; }, 80);
    }

    function decayCombo() {
      if (combo.decayTimer > 0) {
        combo.decayTimer--;
        if (combo.decayTimer <= 0) {
          combo.count = 0;
          comboEl.style.opacity = '0';
        }
      }
    }

    // ============================================================
    //  INPUT
    // ============================================================
    const keys = {};
    addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) {
        e.preventDefault();
      }
      // デバッグトグル
      if (e.code === 'KeyQ') toggleHitbox();
    });
    addEventListener('keyup', (e) => { keys[e.code] = false; });

    // === ゲームパッド入力（標準マッピング）===
    // キーボードと並列動作。padKeys に書き込み、inp() で統合参照する。
    const padKeys = {};

    // 標準ゲームパッドボタン → keys コード変換テーブル
    const PAD_BUTTON_MAP = {
      0:  'Space',     // A / Cross    → ジャンプ
      2:  'KeyJ',      // X / Square   → 弱攻撃
      3:  'KeyK',      // Y / Triangle → 強攻撃
      4:  'KeyL',      // LB / L1      → セカンダリ（Lキー）
      5:  'KeyU',      // RB / R1      → メガクラッシュ専用
      7:  'KeyI',      // RT / R2      → ULT専用
      12: 'ArrowUp',   // D-pad ↑
      13: 'ArrowDown', // D-pad ↓
      14: 'ArrowLeft', // D-pad ←
      15: 'ArrowRight',// D-pad →
    };

    // === キーコンフィグ（将来オプション画面でリバインド可能な設計）===
    // PAD_BUTTON_MAP の kb 値と対応させることで pad も自動追従する
    const KEY_CONFIG = {
      moveLeft:     { kb: 'ArrowLeft',  kb2: 'KeyA'  },
      moveRight:    { kb: 'ArrowRight', kb2: 'KeyD'  },
      moveUp:       { kb: 'ArrowUp',    kb2: 'KeyW'  },
      moveDown:     { kb: 'ArrowDown',  kb2: 'KeyS'  },
      jump:         { kb: 'Space'                     },
      weakAttack:   { kb: 'KeyJ'                      },
      strongAttack: { kb: 'KeyK'                      },
      secondary:    { kb: 'KeyL'                      },
      megaCrash:    { kb: 'KeyU'                      }, // U / R1（J+K同時も発動）
      ult:          { kb: 'KeyI'                      }, // I / R2（J+K+L同時も発動）
    };

    // アクション判定（KEY_CONFIG 参照・将来リバインド対応の統合口）
    function action(name) {
      const cfg = KEY_CONFIG[name];
      if (!cfg) return false;
      return !!(inp(cfg.kb) || (cfg.kb2 && inp(cfg.kb2)));
    }
    const PAD_AXIS_DEAD = 0.25; // スティックデッドゾーン

    function pollGamepad() {
      // padKeys をいったんリセット
      for (const k in padKeys) padKeys[k] = false;

      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      // インデックス固定だと再接続時にずれるため、最初の有効なパッドを使う
      const gp = Array.from(gamepads).find(g => g && g.connected);
      if (!gp) return;

      // ボタン
      for (const [idx, code] of Object.entries(PAD_BUTTON_MAP)) {
        const btn = gp.buttons[idx];
        if (btn && btn.pressed) padKeys[code] = true;
      }

      // 左スティック → 移動（Axis 0 = X, Axis 1 = Y）
      const ax = gp.axes[0] ?? 0;
      const ay = gp.axes[1] ?? 0;
      if (ax < -PAD_AXIS_DEAD) padKeys['ArrowLeft']  = true;
      if (ax >  PAD_AXIS_DEAD) padKeys['ArrowRight'] = true;
      if (ay < -PAD_AXIS_DEAD) padKeys['ArrowUp']    = true;
      if (ay >  PAD_AXIS_DEAD) padKeys['ArrowDown']  = true;
    }

    // キーボード OR ゲームパッドの統合参照
    function inp(code) { return !!(keys[code] || padKeys[code]); }

    // ============================================================
    //  GAME LOOP
    // ============================================================
    const debug = document.getElementById('debug');

    // ============================================================
    //  攻撃の発動・進行
    // ============================================================
    // ID 直指定で攻撃を開始（チェーン外の K 等を含む汎用版）
    function startAttackById(p, id, chainIdx) {
      if (!ATTACKS[id]) return;
      p.state           = STATE.ATTACKING;
      p.attackId        = id;
      p.attackChainIdx  = chainIdx;   // -1 = チェーン外（K など）
      p.stateTimer      = ATTACKS[id].duration;
      p.hitDelivered    = false;
      p.cancelTimer     = 0;
      p.attackBuffered  = false;
    }

    // チェーン共通ラッパ（配列 + インデックスで ID 解決）
    function startAttackFromChain(p, chain, chainIdx) {
      const id = chain[chainIdx];
      if (!id) return;
      p.attackChainArr = chain;
      // 空中Jチェーン開始・継続時に軽くホップ（滞空維持）
      if (chain === A_CHAIN && !p.isGrounded) {
        if (p.vy < 0) p.vy *= 0.8; // ホップ時に落下速度を0.8倍に抑制してふわっとさせる
        p.vy = Math.max(p.vy, PHYSICS.AERIAL_HOP_V);
      }
      startAttackById(p, id, chainIdx);
    }
    // 地上 J チェーン
    function startAttack(p, chainIdx) {
      startAttackFromChain(p, Z_CHAIN, chainIdx);
    }
    // 空中 J チェーン
    function startAerialAttack(p, chainIdx) {
      startAttackFromChain(p, A_CHAIN, chainIdx);
    }

    // 強攻撃（K）はチェーン外で発動
    function startStrongAttack(p) {
      // 現プロト：METEO 固定。将来キャラ別の k_viper / k_cannon / k_bastion に切り替え
      startAttackById(p, 'k_meteo', -1);
    }

    function tryHitEnemies(p, attack) {
      const facing = p.facing;
      let anyHit = false;
      for (const e of enemies) {
        if (!e.isAlive) continue;
        const dx = e.x - p.x;
        const dz = e.z - p.z;
        // 前方判定：facing と dx の符号が一致
        if (Math.sign(dx) !== facing) continue;
        if (Math.abs(dx) > attack.rangeX) continue;
        if (Math.abs(dz) > attack.rangeZ) continue;
        // ヒット
        e.hp = Math.max(0, e.hp - attack.damage);
        e.hitFlashTimer = 7;
        e.knockbackVx   = facing * (attack.knockback * 0.4);
        const resolved = resolveAttackAttr(attack);
        if (attack.launchVy) {
          e.vy = attack.launchVy;
          e.launcherAirborne = !!resolved.peakHang; // LAUNCH_COMBO属性のみ頂点スロー有効
          spawnLaunchSmoke(e.x, e.y, e.z);
        }
        // 空中コンボヒット時：敵もホップして追撃範囲に留まる（頂点スローは発生させない）
        if (p.attackChainArr === A_CHAIN && !p.isGrounded) {
          e.vy = Math.max(e.vy, PHYSICS.AERIAL_HOP_V);
        }
        // 演出
        triggerHitstop(attack.hitstop);
        triggerShake(attack.shake, attack.shake * 2 + 4);
        // ヒット演出：攻撃ごとに色・パーティクル数を変える（差別化）
        const hitColor = attack.hitColor ?? 0xffee44;  // デフォルト黄色（弱攻撃）
        const hitCount = attack.hitCount ?? 10;        // デフォルト10
        spawnHitParticles(e.x - dx * 0.4, e.y + 80, e.z, hitColor, hitCount);
        bumpCombo();
        p.sp = Math.min(SP_CONFIG.MAX, p.sp + SP_CONFIG.GAIN_ON_HIT);
        anyHit = true;
      }
      return anyHit;
    }

    function updateAttack(p) {
      if (p.state !== STATE.ATTACKING) return;
      const atk = ATTACKS[p.attackId];
      const elapsed = atk.duration - p.stateTimer;

      // 判定発生中フレーム
      if (
        !p.hitDelivered &&
        elapsed >= atk.hitFrame &&
        elapsed <  atk.hitFrame + atk.hitDuration
      ) {
        if (tryHitEnemies(p, atk)) {
          p.hitDelivered = true;
        }
      }

      p.stateTimer--;
      if (p.stateTimer <= 0) {
        // 攻撃終了
        if (p.hitDelivered) {
          // ヒット成立 → キャンセル受付に入る
          p.aerialWhiffed   = false;
          p.state           = STATE.HIT_CONFIRM;
          p.cancelTimer     = atk.cancelWindow;
        } else {
          // 空振り → IDLE に戻る（プラン上「空振りキャンセル不可」）
          // 空中で空振りした場合は次の空中Jを封鎖し落下させる
          if (p.attackChainArr === A_CHAIN && !p.isGrounded) {
            p.aerialWhiffed = true;
          }
          p.state           = STATE.IDLE;
          p.attackChainIdx  = -1;
          p.attackId        = null;
        }
      }
    }

    function updateHitConfirm(p) {
      if (p.state !== STATE.HIT_CONFIRM) return;
      p.cancelTimer--;
      if (p.cancelTimer <= 0) {
        // 受付終了 → IDLE 復帰・チェーンリセット
        p.state           = STATE.IDLE;
        p.attackChainIdx  = -1;
        p.attackId        = null;
      }
    }

    // 攻撃入力処理（J キー押下 — 弱攻撃チェーン）
    let zKeyWasDown = false;
    function processAttackInput(p) {
      const zPressed = inp('KeyJ');
      const justPressed = zPressed && !zKeyWasDown;
      zKeyWasDown = zPressed;
      if (!justPressed) return;

      if (p.state === STATE.IDLE) {
        // 地上 / 空中でチェーンを切り替え
        if (p.isGrounded) startAttack(p, 0);
        else if (!p.aerialWhiffed) startAerialAttack(p, 0);
        // aerialWhiffed 中は入力を無視して落下させる
      } else if (p.state === STATE.HIT_CONFIRM) {
        if (p.attackChainIdx < 0) return; // K（チェーン外）後は何もしない
        // 同じチェーン配列を継続（地上 or 空中を自動維持）
        const chain = p.attackChainArr || Z_CHAIN;
        const next  = p.attackChainIdx + 1;
        if (next < chain.length) startAttackFromChain(p, chain, next);
      } else if (p.state === STATE.ATTACKING) {
        p.attackBuffered = true;
      }
    }

    // 強攻撃入力処理（K キー押下）
    let kKeyWasDown = false;
    function processStrongAttackInput(p) {
      const kPressed = inp('KeyK');
      const justPressed = kPressed && !kKeyWasDown;
      kKeyWasDown = kPressed;
      if (!justPressed) return;

      if (p.state === STATE.IDLE) {
        // ↑+K → 打ち上げ攻撃、それ以外 → 通常強攻撃
        const upHeld = inp('ArrowUp') || inp('KeyW');
        if (upHeld) startAttackById(p, 'k_up_meteo', -1);
        else        startStrongAttack(p);
      } else if (p.state === STATE.HIT_CONFIRM) {
        // 弱 → 強キャンセル（J ヒット中の K で繋ぐ）
        if (p.attackChainIdx >= 0) {
          // Jチェーン中に ↑+K → 打ち上げ攻撃
          const upHeld = inp('ArrowUp') || inp('KeyW');
          if (upHeld) {
            startAttackById(p, 'k_up_meteo', -1);
          } else {
            startStrongAttack(p);
          }
        }
      } else if (p.state === STATE.ATTACKING) {
        // ATTACKING 中はバッファに積む（↑ 状態も保存して打ち上げ判定に使う）
        p.kBuffered  = true;
        p.kBufferUp  = inp('ArrowUp') || inp('KeyW');
      }
    }

    // ============================================================
    //  メガクラッシュ / ULT 入力処理
    //  発動条件: SP >= コスト
    //  J+K+L 同時押し（or I / R2）→ SP 十分なら ULT・不足ならメガクラへフォールバック
    //  J+K 同時押し（or U / R1）→ メガクラッシュ
    // ============================================================
    let megaCrashWasDown = false;
    let ultWasDown = false;

    // ダッシュ用：前フレームの方向キー状態（ダブルタップ検知）
    let _dTapWasL = false, _dTapWasR = false;
    let _dTapWasU = false, _dTapWasD = false;

    function triggerMegaCrash(p) {
      if (p.sp < SP_CONFIG.MEGA_CRASH_COST) return; // SP 不足 → 不発
      p.sp -= SP_CONFIG.MEGA_CRASH_COST;
      // TODO Phase 2.3: 自機中心の円形攻撃・command/charge フラグリセット・ヒットストップ
      console.log('[MEGA CRASH] SP残:', p.sp.toFixed(1));
    }

    function triggerUlt(p) {
      if (p.sp < SP_CONFIG.ULT_COST) {
        // SP 不足: J+K+L 入力の場合はメガクラへフォールバック
        triggerMegaCrash(p);
        return;
      }
      p.sp -= SP_CONFIG.ULT_COST;
      // TODO Phase 2.3: 画面全体攻撃・無敵・演出
      console.log('[ULT] SP残:', p.sp.toFixed(1));
    }

    function processMegaCrashUltInput(p) {
      // ULT 判定（優先）: I キー / R2 / J+K+L 同時押し
      const jkl     = inp('KeyJ') && inp('KeyK') && inp('KeyL');
      const ultDown  = action('ult') || jkl;
      const ultJust  = ultDown && !ultWasDown;
      ultWasDown     = ultDown;

      // メガクラッシュ判定: U キー / R1 / J+K（L なし）同時押し
      // ※ULT が発動する場合はメガクラ判定をスキップ
      const jkOnly  = inp('KeyJ') && inp('KeyK') && !inp('KeyL');
      const mcDown  = action('megaCrash') || jkOnly;
      const mcJust  = mcDown && !megaCrashWasDown;
      megaCrashWasDown = mcDown;

      if (ultJust) { triggerUlt(p); return; }
      if (mcJust)  { triggerMegaCrash(p); }
    }

    // ============================================================
    //  ダッシュ（同方向2回タップ・板野式噴射付き）
    // ============================================================
    function startDash(p, dx, dz) {
      p.dashActive    = true;
      p.dashTriggerDx = dx;
      p.dashTriggerDz = dz;
      p.dashDirX      = dx;
      p.dashDirZ      = dz;
      p.lastTapDir    = null;
      p.lastTapTimer  = 0;

      // 板野的演出：対側スラスター噴射で加速理由を可視化
      if (dx !== 0) {
        p.yawBurstSide  = -dx;
        p.yawBurstTimer = PHYSICS.YAW_BURST_FRAMES;
      } else {
        // Z方向ダッシュ → 両肩同時噴射（yawBurstSide=0 で両側表示）
        p.yawBurstSide  = 0;
        p.yawBurstTimer = PHYSICS.YAW_BURST_FRAMES;
      }

      // ダッシュ開始のオレンジ粒子
      spawnHitParticles(p.x, p.y + 20, p.z, 0xff8800, 12);
    }

    function processDashInput(p) {
      const nowL = inp('ArrowLeft')  || inp('KeyA');
      const nowR = inp('ArrowRight') || inp('KeyD');
      const nowU = inp('ArrowUp')    || inp('KeyW');
      const nowD = inp('ArrowDown')  || inp('KeyS');

      const justL = nowL && !_dTapWasL;
      const justR = nowR && !_dTapWasR;
      const justU = nowU && !_dTapWasU;
      const justD = nowD && !_dTapWasD;

      _dTapWasL = nowL;  _dTapWasR = nowR;
      _dTapWasU = nowU;  _dTapWasD = nowD;

      // ダッシュ可能条件（タイマー判定より先にチェック）
      const canDash = p.dashCooldown <= 0
                   && !p.dashActive
                   && p.state !== STATE.ATTACKING;

      // ダブルタップ判定（デクリメント前に確認してウィンドウを正確に保つ）
      if (canDash && p.lastTapTimer > 0 && p.lastTapDir) {
        const d = p.lastTapDir;
        if (justL && d.x === -1) { startDash(p, -1,  0); return; }
        if (justR && d.x ===  1) { startDash(p,  1,  0); return; }
        if (justU && d.z === -1) { startDash(p,  0, -1); return; }
        if (justD && d.z ===  1) { startDash(p,  0,  1); return; }
      }

      // タイマーを1フレーム進める（攻撃中も進める）
      if (p.lastTapTimer > 0) p.lastTapTimer--;

      if (!canDash) return;

      // 最初のタップを記録（優先: L > R > U > D）
      if      (justL) { p.lastTapDir = {x:-1, z: 0}; p.lastTapTimer = PHYSICS.DASH_TAP_WINDOW; }
      else if (justR) { p.lastTapDir = {x: 1, z: 0}; p.lastTapTimer = PHYSICS.DASH_TAP_WINDOW; }
      else if (justU) { p.lastTapDir = {x: 0, z:-1}; p.lastTapTimer = PHYSICS.DASH_TAP_WINDOW; }
      else if (justD) { p.lastTapDir = {x: 0, z: 1}; p.lastTapTimer = PHYSICS.DASH_TAP_WINDOW; }
    }

    // バッファ消化（HIT_CONFIRM になった瞬間に Z バッファがあれば次段へ）
    function consumeAttackBuffer(p) {
      if (p.state === STATE.HIT_CONFIRM && p.attackBuffered) {
        const chain = p.attackChainArr || Z_CHAIN;
        const next  = p.attackChainIdx + 1;
        p.attackBuffered = false;
        if (next < chain.length) startAttackFromChain(p, chain, next);
      }
    }

    // ATTACKING中にバッファされたK入力をHIT_CONFIRM移行時に消費
    function consumeStrongAttackBuffer(p) {
      if (p.state !== STATE.HIT_CONFIRM) return;
      if (!p.kBuffered) return;
      if (p.attackChainIdx < 0) { p.kBuffered = false; return; } // Kチェーン外は無視
      const wasUp  = p.kBufferUp;
      p.kBuffered  = false;
      p.kBufferUp  = false;
      if (wasUp) startAttackById(p, 'k_up_meteo', -1);
      else       startStrongAttack(p);
    }

    // キャンセルジャンプ：HIT_CONFIRM 中に SPACE → 大噴射ジャンプ
    // 仕様: J チェーン or 打ち上げ属性持ち技のみキャンセルジャンプ可
    //       K（強攻撃）は打ち上げ属性なし → 不可
    function tryCancelJump(p) {
      if (p.state !== STATE.HIT_CONFIRM) return false;
      if (!inp('Space')) return false;
      // 地上Jチェーン中 or 打ち上げ属性持ち技のみ許可
      // A_CHAIN（空中Jコンボ）は対象外 → 空中J→SPACE→空中J の無限ループを防止
      const atk = ATTACKS[p.attackId];
      const isGroundChain = p.attackChainArr === Z_CHAIN && p.attackChainIdx >= 0;
      const isLauncher    = atk && atk.launcher === true;
      if (!isGroundChain && !isLauncher) return false;
      // 発動！
      p.vy               = PHYSICS.CANCEL_JUMP_V;
      p.isGrounded       = false;
      p.thrustFramesLeft = PHYSICS.CANCEL_JUMP_FRAMES;
      p.bigBurstTimer    = 14;  // 大噴射演出時間
      // ステートは IDLE に戻す（空中でまた Z を押せばコンボ継続可能・将来空中攻撃で対応）
      p.state            = STATE.IDLE;
      p.attackChainIdx   = -1;
      p.attackId         = null;
      // 視覚的フィードバック：大きめのシェイクとスローパーティクル
      triggerShake(4, 8);
      spawnHitParticles(p.x, p.y + 20, p.z, 0x00ddff, 16);
      return true;
    }

    function updatePlayer(p) {
      // === SP 自然回復 ===
      p.sp = Math.min(SP_CONFIG.MAX, p.sp + SP_CONFIG.REGEN_RATE);
      if (p.dashCooldown > 0) p.dashCooldown--;

      // === 攻撃入力処理（毎フレーム）===
      processMegaCrashUltInput(p);  // ULT / メガクラ（優先度高）
      processAttackInput(p);
      processStrongAttackInput(p);
      processDashInput(p);          // ダッシュ（ダブルタップ検知）

      // === キャンセルジャンプ判定 ===
      tryCancelJump(p);

      // === ステート更新 ===
      updateAttack(p);
      updateHitConfirm(p);
      consumeAttackBuffer(p);
      consumeStrongAttackBuffer(p);

      // === 攻撃中は地上移動を抑制 ===
      const movementLocked = (p.state === STATE.ATTACKING) && p.isGrounded;

      // === 入力 → 移動ベクトル（空中慣性 → ダッシュ → 通常の優先順）===
      let mvx = 0, mvz = 0;
      const isDashing = p.dashActive;

      if (!p.isGrounded) {
        // 空中：慣性ベースの移動。キー入力で緩やかに方向修正できるが急停止しない
        let ix = 0, iz = 0;
        if (inp('ArrowLeft')  || inp('KeyA')) ix -= 1;
        if (inp('ArrowRight') || inp('KeyD')) ix += 1;
        if (inp('ArrowUp')    || inp('KeyW')) iz -= 1;
        if (inp('ArrowDown')  || inp('KeyS')) iz += 1;
        const ilen = Math.hypot(ix, iz);
        if (ilen > 0) { ix /= ilen; iz /= ilen; }
        p.airVx = p.airVx * PHYSICS.AIR_FRICTION + ix * PHYSICS.AIR_CONTROL;
        p.airVz = p.airVz * PHYSICS.AIR_FRICTION + iz * PHYSICS.AIR_CONTROL;
        p.x += p.airVx;
        p.z += p.airVz;
        mvx = p.airVx;
        mvz = p.airVz;
      } else if (isDashing) {
        // 全方向キーから移動ベクトル生成
        let dvx = 0, dvz = 0;
        if (inp('ArrowLeft')  || inp('KeyA')) dvx -= 1;
        if (inp('ArrowRight') || inp('KeyD')) dvx += 1;
        if (inp('ArrowUp')    || inp('KeyW')) dvz -= 1;
        if (inp('ArrowDown')  || inp('KeyS')) dvz += 1;
        const anyKey = dvx !== 0 || dvz !== 0;

        if (!anyKey || movementLocked) {
          // 全キー離し or 攻撃 → ダッシュ終了
          p.dashActive   = false;
          p.dashCooldown = PHYSICS.DASH_COOLDOWN;
          // mvx/mvz は 0 のまま → このフレームは移動なし
        } else {
          const dvlen = Math.hypot(dvx, dvz);
          if (dvlen > 0) { dvx /= dvlen; dvz /= dvlen; }

          // 移動軸変化 30° 以上 → 足元火花（急制動の板野演出）
          const prevAngle = Math.atan2(p.dashDirZ, p.dashDirX);
          const currAngle = Math.atan2(dvz, dvx);
          let angleDiff = Math.abs(currAngle - prevAngle);
          if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
          if (angleDiff > PHYSICS.DASH_SPARK_ANGLE && p.isGrounded) {
            spawnHitParticles(p.x, p.y + 5, p.z, p.dashSparkColor, 10);
          }

          p.dashDirX = dvx;
          p.dashDirZ = dvz;
          mvx = dvx;
          mvz = dvz;
          p.x += mvx * PHYSICS.SPEED * PHYSICS.DASH_SPEED_MULT;
          p.z += mvz * PHYSICS.SPEED * PHYSICS.DASH_SPEED_MULT;
        }
      } else if (!movementLocked) {
        if (inp('ArrowLeft')  || inp('KeyA')) mvx -= 1;
        if (inp('ArrowRight') || inp('KeyD')) mvx += 1;
        if (inp('ArrowUp')    || inp('KeyW')) mvz -= 1;
        if (inp('ArrowDown')  || inp('KeyS')) mvz += 1;
        const rawLen = Math.hypot(mvx, mvz);
        if (rawLen > 0) { mvx /= rawLen; mvz /= rawLen; }
        p.x += mvx * PHYSICS.SPEED;
        p.z += mvz * PHYSICS.SPEED;
      }
      // ← ブロック外で len を計算（isMoving 判定・待機バウンスに使用）
      const len = Math.hypot(mvx, mvz);

      // ステージバウンド
      p.x = Math.max(PHYSICS.STAGE_LEFT, Math.min(PHYSICS.STAGE_RIGHT, p.x));
      p.z = Math.max(-380, Math.min(380, p.z));

      // === 向き（ダッシュ中は dash 方向に従う・攻撃中は固定）===
      if (isDashing || !movementLocked) {
        if (mvx > 0) p.facing = 1;
        else if (mvx < 0) p.facing = -1;
      }

      // === 方向転換検知 → 肩ヨースラスター噴射（板野的姿勢制御推力） ===
      // ダッシュ中は startDash() 内でスラスターを設定済みのためスキップ
      if (!isDashing) {
        const curMoveDir = (mvx > 0) ? 1 : (mvx < 0 ? -1 : 0);
        if (curMoveDir !== 0 && p.prevMoveDir !== 0 && curMoveDir !== p.prevMoveDir) {
          p.yawBurstSide  = p.prevMoveDir;
          p.yawBurstTimer = PHYSICS.YAW_BURST_FRAMES;
        }
        if (curMoveDir !== 0) p.prevMoveDir = curMoveDir;
      }

      // === ジャンプ・ブースター・重力 ===
      // 接地中にスペース → 初速付与＋ブースター点火
      // ※キャンセルジャンプ（tryCancelJump）で既に発動済みの場合は二重発動しない
      if (p.isGrounded && inp('Space') && p.bigBurstTimer === 0) {
        // ジャンプ時に地上の速度を空中慣性として引き継ぐ
        if (p.dashActive) {
          // ダッシュ中ジャンプ：ダッシュ速度をそのまま慣性に
          p.airVx = p.dashDirX * PHYSICS.SPEED * PHYSICS.DASH_SPEED_MULT;
          p.airVz = p.dashDirZ * PHYSICS.SPEED * PHYSICS.DASH_SPEED_MULT;
          p.dashActive = false; // ダッシュはジャンプで終了（cooldown設定なし）
        } else {
          // 通常ジャンプ：歩き速度を慣性に
          p.airVx = mvx * PHYSICS.SPEED;
          p.airVz = mvz * PHYSICS.SPEED;
        }
        p.vy = PHYSICS.JUMP_V;
        p.isGrounded = false;
        p.thrustFramesLeft = PHYSICS.THRUST_FRAMES;
      }

      // 空中処理
      const thrustingNow =
        !p.isGrounded &&
        inp('Space') &&
        p.thrustFramesLeft > 0 &&
        p.vy >= 0;  // 上昇中のみ推力（落下中は不可）

      if (!p.isGrounded) {
        if (thrustingNow) {
          // キャンセルジャンプ中は推力UP
          const force = (p.bigBurstTimer > 0)
            ? PHYSICS.CANCEL_JUMP_THRUST
            : PHYSICS.THRUST_FORCE;
          p.vy += force;
          p.thrustFramesLeft--;
        }
        p.vy -= PHYSICS.GRAVITY;
        p.y += p.vy;
        if (p.y <= 0) {
          p.y = 0;
          p.vy = 0;
          p.isGrounded    = true;
          p.aerialWhiffed = false;
          p.thrustFramesLeft = 0;
          // 着地時に方向キーが入力中であればダッシュを自動継続
          { let ldx = 0, ldz = 0;
            if (inp('ArrowLeft')  || inp('KeyA')) ldx -= 1;
            if (inp('ArrowRight') || inp('KeyD')) ldx += 1;
            if (inp('ArrowUp')    || inp('KeyW')) ldz -= 1;
            if (inp('ArrowDown')  || inp('KeyS')) ldz += 1;
            const llen = Math.hypot(ldx, ldz);
            if (llen > 0 && p.dashCooldown === 0) {
              p.dashActive   = true;
              p.dashDirX     = ldx / llen;
              p.dashDirZ     = ldz / llen;
            }
          }
          p.airVx = 0;
          p.airVz = 0;
        }
      }

      // 大噴射タイマーの減衰
      if (p.bigBurstTimer > 0) p.bigBurstTimer--;

      const parts = p.mesh.userData.parts;

      // ブースター炎（足元）の表示・パルス
      // ダッシュ中もスラスター点火（オレンジで差別化）
      const thrustOrDash = thrustingNow || isDashing;
      parts.thrusterL.visible = thrustOrDash;
      parts.thrusterR.visible = thrustOrDash;
      if (thrustOrDash) {
        const isBig  = p.bigBurstTimer > 0;
        const isDash = isDashing && !thrustingNow;
        // 色：キャンセルジャンプ=黄 / 通常ジャンプ=シアン / ダッシュ=オレンジ
        const col  = isBig ? 0xffff66 : isDash ? 0xff8800 : 0x00ddff;
        const sz   = isBig ? 1.8 : isDash ? 1.4 : 1.0;
        const pulse = (isBig ? 1.6 : isDash ? 1.3 : 0.85)
                    + Math.random() * (isBig ? 0.7 : isDash ? 0.5 : 0.4);
        parts.thrusterL.scale.set(sz, pulse, sz);
        parts.thrusterR.scale.set(sz, pulse, sz);
        parts.thrusterL.material.color.setHex(col);
        parts.thrusterR.material.color.setHex(col);
      } else {
        parts.thrusterL.material.color.setHex(0x00ddff);
        parts.thrusterR.material.color.setHex(0x00ddff);
      }

      // ヨースラスター（肩）の表示・パルス
      // yawBurstSide === 0 はZ軸ダッシュ時の両肩同時噴射
      if (p.yawBurstTimer > 0) p.yawBurstTimer--;
      const yawActive = p.yawBurstTimer > 0;
      parts.yawL.visible = yawActive && (p.yawBurstSide <= 0);
      parts.yawR.visible = yawActive && (p.yawBurstSide >= 0);
      if (yawActive) {
        const yawPulse = 0.6 + Math.random() * 0.6;
        const target = (p.yawBurstSide < 0) ? parts.yawL : parts.yawR;
        target.scale.set(1, yawPulse, 1);
      }

      // === 待機時のバウンス（生き生き演出） ===
      const isMoving = (len > 0);
      if (isMoving && p.isGrounded) {
        p.bobPhase += 0.3;
      } else if (p.isGrounded) {
        p.bobPhase += 0.05;
      }
      const bobY = isMoving ? Math.abs(Math.sin(p.bobPhase)) * 4 : Math.sin(p.bobPhase) * 2;

      // === メッシュへ反映 ===
      p.mesh.position.set(p.x, p.y + bobY, p.z);
      // 向き：右なら +Z、左なら -Z 方向に体を回す
      const targetRot = (p.facing > 0) ? Math.PI * 0.5 : -Math.PI * 0.5;
      p.mesh.rotation.y += (targetRot - p.mesh.rotation.y) * 0.2;
    }

    function updateEnemies() {
      for (const e of enemies) {
        if (!e.isAlive) continue;
        // 死亡判定
        if (e.hp <= 0) {
          e.hp = e.maxHp;  // ダミーは即復活（無限練習用）
          spawnHitParticles(e.x, e.y + 100, e.z, 0xff8844, 24);
          triggerShake(8, 14);
        }
        // ノックバック減衰（水平）
        e.x += e.knockbackVx;
        e.knockbackVx *= 0.78;
        if (Math.abs(e.knockbackVx) < 0.1) e.knockbackVx = 0;
        // ステージバウンドで壁に当たったらノックバックを止める
        if (e.x < PHYSICS.STAGE_LEFT)  { e.x = PHYSICS.STAGE_LEFT;  e.knockbackVx = 0; }
        if (e.x > PHYSICS.STAGE_RIGHT) { e.x = PHYSICS.STAGE_RIGHT; e.knockbackVx = 0; }
        e.mesh.position.x = e.x;
        // 打ち上げ（垂直）
        if (e.vy !== 0 || e.y > 0 || e.peakHangTimer > 0) {
          // 頂点到達検出：LAUNCH_COMBO属性で打ち上げ中かつ上昇→下降に切り替わった瞬間
          if (e.launcherAirborne && e.prevVy > 0 && e.vy <= 0 && e.y > 0 && e.peakHangTimer === 0) {
            e.peakHangTimer = 36;
            e.peakHangTotal = 36;
            spawnHitParticles(e.x, e.y + 100, e.z, 0xffffff, 8);
          }
          e.prevVy = e.vy;

          let gravFactor;
          if (e.peakHangTimer > 0) {
            // フェードイン：最初の12Fかけて重力を1.0→0.05へ滑らかに落とす
            const elapsed  = e.peakHangTotal - e.peakHangTimer;
            const fadeT    = Math.min(1, elapsed / 12);
            const baseFactor = (e.vy < 0) ? 0.6 : 1.0;
            gravFactor = baseFactor + (0.05 - baseFactor) * fadeT;
            e.peakHangTimer--;
          } else if (e.y > 0 && e.vy < 0) {
            gravFactor = 0.6; // スロー終了後の落下も6割重力
          } else {
            gravFactor = 1.0;
          }
          e.vy -= PHYSICS.GRAVITY * gravFactor;
          e.y  += e.vy;
          if (e.y <= 0) {
            e.y = 0; e.vy = 0; e.prevVy = 0;
            e.peakHangTimer = 0; e.peakHangTotal = 0;
            e.launcherAirborne = false;
          }
          e.mesh.position.y = e.y;
        }

        // ヒットフラッシュ
        if (e.hitFlashTimer > 0) {
          e.hitFlashTimer--;
          const t = e.hitFlashTimer / 7;
          e.mesh.userData.parts.body.material.color.setRGB(
            0.53 + t * 0.47, 0.27, 0.27
          );
          e.mesh.userData.parts.head.material.color.setRGB(
            0.87 + t * 0.13, 0.67, 0.27
          );
        } else {
          e.mesh.userData.parts.body.material.color.setHex(0x884444);
          e.mesh.userData.parts.head.material.color.setHex(0xddaa44);
        }
      }
    }

    function updateCamera() {
      const p = players[0];
      // X軸追従（Z, Yは固定）
      const baseX = p.x;
      const baseY = 800;

      // シェイク計算
      if (shakeTimer > 0) {
        shakeOffsetX = (Math.random() - 0.5) * shakeStrength * 2;
        shakeOffsetY = (Math.random() - 0.5) * shakeStrength * 2;
        shakeTimer--;
        if (shakeTimer <= 0) {
          shakeStrength = 0;
          shakeOffsetX  = 0;
          shakeOffsetY  = 0;
        }
      } else {
        shakeOffsetX = 0;
        shakeOffsetY = 0;
      }

      camera.position.x = baseX + shakeOffsetX;
      camera.position.y = baseY + shakeOffsetY;
      camera.lookAt(baseX, 0, 0);
    }

    const spBarEl = document.getElementById('sp-bar');
    function updateSPGauge() {
      const p = players[0];
      const pct = p.sp / SP_CONFIG.MAX;
      spBarEl.style.width = (pct * 100).toFixed(1) + '%';
      // 残量が少ないと暗い青→シアンで点滅感
      const brightness = 0.5 + pct * 0.5;
      const r = Math.round(0   * brightness);
      const g = Math.round(200 * brightness);
      const b = Math.round(255 * brightness);
      spBarEl.style.background = `rgb(${r},${g},${b})`;
    }

    function updateDebug() {
      const p = players[0];
      debug.textContent =
        `x:${p.x.toFixed(0)} z:${p.z.toFixed(0)} y:${p.y.toFixed(0)} | ` +
        `state:${p.state} chain:${p.attackChainIdx} | ` +
        `grounded:${p.isGrounded ? 'Y' : 'N'}`;
      dummyHpEl.textContent = `${enemies[0].hp}/${enemies[0].maxHp}`;
    }

    function update() {
      players.forEach(updatePlayer);
      updateEnemies();
      updateParticles();
      decayCombo();
      updateCamera();
      updateSPGauge();
      updateDebug();
    }

    function render() {
      renderer.render(scene, camera);
    }

    // === デバッグ用 HUD ハイライト ===
    // 押されているボタンに対応する説明行を黄色くハイライトする
    const HUD_HIGHLIGHT_MAP = [
      { id: 'hk-move',      check: () => inp('ArrowLeft') || inp('ArrowRight') || inp('ArrowUp') || inp('ArrowDown') || inp('KeyA') || inp('KeyD') || inp('KeyW') || inp('KeyS') },
      { id: 'hk-jump',      check: () => action('jump') },
      { id: 'hk-weak',      check: () => action('weakAttack') },
      { id: 'hk-strong',    check: () => action('strongAttack') },
      { id: 'hk-cancel',    check: () => action('jump') && players[0]?.state === STATE.HIT_CONFIRM },
      { id: 'hk-secondary', check: () => action('secondary') },
      { id: 'hk-mega',      check: () => action('megaCrash') || (inp('KeyJ') && inp('KeyK') && !inp('KeyL')) },
      { id: 'hk-ult',       check: () => action('ult')      || (inp('KeyJ') && inp('KeyK') &&  inp('KeyL')) },
    ];
    const _hkEls = {};
    HUD_HIGHLIGHT_MAP.forEach(({ id }) => { _hkEls[id] = document.getElementById(id); });

    function updateHudHighlight() {
      HUD_HIGHLIGHT_MAP.forEach(({ id, check }) => {
        const el = _hkEls[id];
        if (!el) return;
        el.classList.toggle('hk-active', check());
      });
    }

    // ============================================================
    //  デバッグ：ヒットボックス可視化（Q トグル）
    //  depthTest:false でキャラを貫通して常に前面表示
    //  色凡例: 緑=プレイヤーボディ / オレンジ=攻撃判定 / シアン=敵ボディ
    //  ※ loop() より前に定義する（TDZ 回避 — CLAUDE.md 変数定義順の鉄則）
    // ============================================================
    let debugHitbox = false;
    const _hkHudEl = document.getElementById('hk-hitbox');

    function _makeWireBox(w, h, d, color) {
      const box = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d)),
        new THREE.LineBasicMaterial({ color, depthTest: false })
      );
      box.renderOrder = 999;
      box.visible = false;
      scene.add(box);
      return box;
    }

    // プレイヤーボディ（緑）— torso〜headまでの外形
    const _dbgPlayerBody = _makeWireBox(70, 170, 55, 0x00ff44);

    // 攻撃ヒットボックス（オレンジ）— 判定フレーム中のみ出現・scale で可変
    const _dbgAttackBox  = _makeWireBox(1, 1, 1, 0xff6600);

    // 敵ボディ（シアン）— 各敵に1つ生成
    const _dbgEnemyBodies = enemies.map(() => _makeWireBox(70, 185, 60, 0x00ccff));

    // ============================================================
    //  背景コリジョン表示（半透明塗りつぶし）
    //  色凡例: 緑=床 / オレンジ=X境界壁 / 青=Z境界壁
    //  depthWrite:false で透過オブジェクトのソートを安定させる
    // ============================================================
    function _makeCollisionMesh(w, h, d, color, opacity, order = 997) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshBasicMaterial({
          color, transparent: true, opacity,
          depthWrite: false, side: THREE.DoubleSide,
        })
      );
      mesh.renderOrder = order;
      mesh.visible = false;
      scene.add(mesh);
      return mesh;
    }

    const _COL_Z_HALF = 380;
    const _COL_Z_SPAN = _COL_Z_HALF * 2;  // 760
    const _COL_WALL_H = 400;               // 壁の高さ（プレイヤー約2体分）

    // 床（緑）— renderOrder 999 で最前面。カメラ手前の壁より必ず上に描画
    const _dbgFloor = _makeCollisionMesh(
      PHYSICS.STAGE_RIGHT - PHYSICS.STAGE_LEFT, 2, _COL_Z_SPAN, 0x00ff88, 0.25, 999
    );
    _dbgFloor.position.set(
      (PHYSICS.STAGE_LEFT + PHYSICS.STAGE_RIGHT) / 2, 1, 0
    );

    // 左右壁（オレンジ）— X方向の移動限界
    const _dbgWallL = _makeCollisionMesh(4, _COL_WALL_H, _COL_Z_SPAN, 0xff7700, 0.28);
    const _dbgWallR = _makeCollisionMesh(4, _COL_WALL_H, _COL_Z_SPAN, 0xff7700, 0.28);

    // 前後壁（青）— Z方向の移動限界
    const _dbgWallFront = _makeCollisionMesh(
      PHYSICS.STAGE_RIGHT - PHYSICS.STAGE_LEFT, _COL_WALL_H, 4, 0x4499ff, 0.3
    );
    const _dbgWallBack = _makeCollisionMesh(
      PHYSICS.STAGE_RIGHT - PHYSICS.STAGE_LEFT, _COL_WALL_H, 4, 0x4499ff, 0.3
    );

    const _dbgCollisionMeshes = [_dbgFloor, _dbgWallL, _dbgWallR, _dbgWallFront, _dbgWallBack];

    function toggleHitbox() {
      debugHitbox = !debugHitbox;
      _hkHudEl.textContent = `Q: ヒットボックス / コリジョン [${debugHitbox ? 'ON' : 'OFF'}]`;
      _hkHudEl.classList.toggle('hk-toggle-on', debugHitbox);
      if (!debugHitbox) {
        _dbgPlayerBody.visible = false;
        _dbgAttackBox.visible  = false;
        _dbgEnemyBodies.forEach(b => { b.visible = false; });
        _dbgCollisionMeshes.forEach(m => { m.visible = false; });
      }
    }

    function updateHitboxDebug() {
      if (!debugHitbox) return;
      const p = players[0];

      // プレイヤーボディ（中心 y = p.y + 85）
      _dbgPlayerBody.visible = true;
      _dbgPlayerBody.position.set(p.x, p.y + 85, p.z);

      // 攻撃ヒットボックス（判定フレーム中のみ表示）
      let showAtk = false;
      if (p.state === STATE.ATTACKING && p.attackId) {
        const atk     = ATTACKS[p.attackId];
        const elapsed = atk.duration - p.stateTimer;
        if (elapsed >= atk.hitFrame && elapsed < atk.hitFrame + atk.hitDuration) {
          const rx = atk.rangeX;
          const rz = atk.rangeZ;
          _dbgAttackBox.scale.set(rx, 180, rz * 2);
          _dbgAttackBox.position.set(p.x + p.facing * rx * 0.5, p.y + 90, p.z);
          showAtk = true;
        }
      }
      _dbgAttackBox.visible = showAtk;

      // 敵ボディ
      enemies.forEach((e, i) => {
        const b = _dbgEnemyBodies[i];
        if (!b) return;
        b.visible = e.isAlive;
        if (e.isAlive) b.position.set(e.x, e.y + 92, e.z);
      });

      // 背景コリジョン表示（ランタイム変更に追従）
      const sl = PHYSICS.STAGE_LEFT, sr = PHYSICS.STAGE_RIGHT;
      const cx = (sl + sr) / 2, sw = sr - sl;
      const cy = _COL_WALL_H / 2;

      _dbgFloor.visible = true;
      _dbgFloor.position.set(cx, 1, 0);
      _dbgFloor.scale.set(sw / (sr - sl || 1), 1, 1); // STAGE_LEFT/RIGHT 動的変更対応

      _dbgWallL.visible = true;
      _dbgWallL.position.set(sl, cy, 0);

      _dbgWallR.visible = true;
      _dbgWallR.position.set(sr, cy, 0);

      _dbgWallFront.visible = true;
      _dbgWallFront.position.set(cx, cy, -_COL_Z_HALF);
      _dbgWallFront.scale.set(sw / (sr - sl || 1), 1, 1);

      _dbgWallBack.visible = true;
      _dbgWallBack.position.set(cx, cy, _COL_Z_HALF);
      _dbgWallBack.scale.set(sw / (sr - sl || 1), 1, 1);
    }

    function loop() {
      pollGamepad();       // ゲームパッド状態を padKeys に反映
      updateHudHighlight();
      updateHitboxDebug(); // ヒットボックス可視化（Q トグル）
      // ヒットストップ：更新スキップ・描画は継続
      if (hitstopTimer > 0) {
        hitstopTimer--;
        render();
        requestAnimationFrame(loop);
        return;
      }
      update();
      render();
      requestAnimationFrame(loop);
    }
    loop();

    // ============================================================
    //  RESIZE / HUD スケール追従
    //  16:9 固定なのでアスペクト変更は不要。
    //  CSS が #game-frame のサイズをウィンドウに合わせてレターボックス調整する。
    //  内部レンダリング解像度は 1920x1080 を維持。
    //  HUD は #hud-layer を transform: scale() でフレームサイズに追従させる。
    // ============================================================
    function updateHudScale() {
      const frame = document.getElementById('game-frame');
      if (frame) {
        const scale = frame.clientWidth / GAME_WIDTH;
        document.documentElement.style.setProperty('--hud-scale', scale);
      }
      if (renderer.domElement) {
        renderer.domElement.style.width  = '100%';
        renderer.domElement.style.height = '100%';
      }
    }
    addEventListener('resize', updateHudScale);
    updateHudScale();  // 初期化
    window.SB = {
      scene, camera, renderer, players, enemies,
      CHARACTER_ASSETS,
      PHYSICS, SP_CONFIG, ATTACKS, STATE, Z_CHAIN, A_CHAIN,
      KEY_CONFIG,   // キーコンフィグ（将来オプション画面でリバインド可能）
      // 共通関数（コンソールから呼べる）
      triggerHitstop, triggerShake, spawnHitParticles,
      triggerMegaCrash, triggerUlt,
      // ダッシュ（例: SB.startDash(SB.players[0], 1, 0) で右ダッシュ強制発動）
      startDash,
    };
    console.log('[SCRAP BLITZ] Phase 2.2 (SP / strong attack / pad / mega crash / ult) loaded.');
    console.log('[SCRAP BLITZ] Tunable: SB.PHYSICS / SB.ATTACKS / SB.SP_CONFIG / SB.KEY_CONFIG');
    console.log('[SCRAP BLITZ] Try: SB.SP_CONFIG.MEGA_CRASH_COST = 10');
  </script>
</body>
