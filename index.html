<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ブロック崩し</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
  }
  h1 {
    font-size: 1.4rem;
    letter-spacing: 4px;
    margin-bottom: 12px;
    color: #88aaff;
    text-transform: uppercase;
  }
  canvas {
    border: 2px solid #334;
    background: #05050f;
    display: block;
    box-shadow: 0 0 40px #2244aa55;
  }
  #info {
    margin-top: 10px;
    font-size: 0.75rem;
    color: #556;
    letter-spacing: 2px;
  }
  #volume-controls {
    display: flex;
    gap: 32px;
    margin-top: 12px;
    align-items: center;
    font-size: 0.72rem;
    color: #556;
    letter-spacing: 1px;
  }
  .vol-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vol-group label { min-width: 36px; }
  .vol-group input[type=range] {
    -webkit-appearance: none;
    width: 140px;
    height: 4px;
    background: #223;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .vol-group input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #6688cc;
    cursor: pointer;
    transition: background 0.15s;
  }
  .vol-group input[type=range]::-webkit-slider-thumb:hover { background: #88aaff; }
  .vol-value { min-width: 28px; text-align: right; color: #778; }
</style>
</head>
<body>
<h1>BLOCK BREAKER</h1>
<canvas id="c" width="1600" height="1080"></canvas>
<div id="info">← → / A D キーでパドル操作　|　スペースキーでスタート　|　ESC で一時停止</div>
<div id="volume-controls">
  <div class="vol-group">
    <label>BGM</label>
    <input type="range" id="vol-bgm" min="0" max="100" value="50">
    <span class="vol-value" id="val-bgm">50</span>
  </div>
  <div class="vol-group">
    <label>SE</label>
    <input type="range" id="vol-se" min="0" max="100" value="50">
    <span class="vol-value" id="val-se">50</span>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;

// ---- Background ----
const stars = Array.from({length: 420}, () => ({
  x: Math.random() * W, y: Math.random() * H,
  r: Math.random() * 1.6 + 0.3,
  a: Math.random() * 0.35 + 0.1,
}));

const CRATERS = [
  {cx:-0.20,cy:-0.30,r:0.12}, {cx: 0.35,cy: 0.10,r:0.08},
  {cx:-0.08,cy: 0.36,r:0.14}, {cx: 0.14,cy:-0.40,r:0.06},
  {cx:-0.40,cy: 0.12,r:0.09}, {cx: 0.28,cy:-0.27,r:0.07},
  {cx:-0.30,cy:-0.14,r:0.05}, {cx: 0.06,cy: 0.22,r:0.04},
  {cx: 0.42,cy: 0.33,r:0.06}, {cx: 0.50,cy:-0.10,r:0.05},
  {cx:-0.52,cy:-0.20,r:0.04}, {cx: 0.18,cy: 0.50,r:0.05},
];

function drawBackground() {
  const mx = W / 2, my = H / 2, mr = 290;

  // 夜空グラデーション
  const sky = ctx.createRadialGradient(mx, my, 0, mx, my, W * 0.75);
  sky.addColorStop(0, '#07091a');
  sky.addColorStop(1, '#010205');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // 星
  for (const s of stars) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,215,255,${s.a})`;
    ctx.fill();
  }

  // 月の大気光
  const glow = ctx.createRadialGradient(mx, my, mr * 0.85, mx, my, mr * 1.7);
  glow.addColorStop(0, 'rgba(160,185,220,0.055)');
  glow.addColorStop(1, 'rgba(160,185,220,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(mx, my, mr * 1.7, 0, Math.PI * 2); ctx.fill();

  // 月本体（球面シェーディング）
  const mg = ctx.createRadialGradient(
    mx - mr * 0.28, my - mr * 0.28, mr * 0.04,
    mx + mr * 0.08, my + mr * 0.08, mr
  );
  mg.addColorStop(0,   'rgba(130,142,158,0.36)');
  mg.addColorStop(0.45,'rgba(95,105,118,0.30)');
  mg.addColorStop(1,   'rgba(40,44,52,0.24)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();

  // 月縁の薄いリム光
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(160,175,200,0.07)';
  ctx.lineWidth = 4; ctx.stroke();

  // クレーター
  for (const c of CRATERS) {
    if (Math.hypot(c.cx, c.cy) + c.r > 1.0) continue;
    const cx = mx + c.cx * mr, cy = my + c.cy * mr, cr = c.r * mr;
    ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(15,18,26,0.18)'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx - cr*0.18, cy - cr*0.18, cr*0.88, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(155,168,188,0.07)'; ctx.lineWidth = 1; ctx.stroke();
  }
}

// ---- Audio ----
const SE_VOLUME  = 0.5;
const BGM_VOLUME = 0.5;

const SE = {
  wall:     new Audio('sounds/se_wall.mp3'),
  block01:  new Audio('sounds/se_block01.mp3'),
  block02:  new Audio('sounds/se_block02.mp3'),
  paddle01: new Audio('sounds/se_paddle01.mp3'),
  paddle02: new Audio('sounds/se_paddle02.mp3'),
  miss:     new Audio('sounds/se_miss.mp3'),
  charge:   new Audio('sounds/se_charge.mp3'),
  laser:    new Audio('sounds/se_laser.mp3'),
  clear:    new Audio('sounds/se_clear.mp3'),
  bomb01:   new Audio('sounds/se_bomb01.mp3'),
  bomb02:   new Audio('sounds/se_bomb02.mp3'),
  item:     new Audio('sounds/se_item.mp3'),
  death:    new Audio('sounds/se_death.mp3'),
  areaup:   new Audio('sounds/se_areaup.mp3'),
};
for (const s of Object.values(SE)) s.volume = SE_VOLUME;
SE.item.volume = SE_VOLUME * 0.5;

const BGM = {
  normal: new Audio('sounds/bgm01.mp3'),
  boss:   new Audio('sounds/bgm02.mp3'),
};
for (const b of Object.values(BGM)) { b.loop = true; b.volume = BGM_VOLUME; }
BGM.boss.volume = BGM_VOLUME * 0.65;

let currentBGM = null;

function playSound(audio) {
  audio.currentTime = 0;
  audio.playbackRate = 0.92 + Math.random() * 0.16; // ±8% のランダム音程
  audio.play().catch(() => {});
}

function playWall()         { playSound(SE.wall); }

function playBlock(pierce)    { playSound(pierce ? SE.block02  : SE.block01);  }
function playPaddle(pierce)   { playSound(pierce ? SE.paddle02 : SE.paddle01); }
function playMiss()           { playSound(SE.miss);   }
function playCharge()         { playSound(SE.charge); }
function playLaser()          { playSound(SE.laser);  }

function startBGM(type = 'normal') {
  if (currentBGM) { currentBGM.pause(); currentBGM.currentTime = 0; }
  currentBGM = BGM[type];
  currentBGM.play().catch(() => {});
}

function stopBGM() {
  if (!currentBGM) return;
  currentBGM.pause();
  currentBGM.currentTime = 0;
  currentBGM = null;
}

function pauseAudio()  { if (currentBGM) currentBGM.pause(); }
function resumeAudio() { if (currentBGM) currentBGM.play().catch(() => {}); }

function fadeBGM(duration) {
  if (!currentBGM) return;
  const bgm = currentBGM;
  const startVol = bgm.volume;
  const start = Date.now();
  const tick = setInterval(() => {
    const t = (Date.now() - start) / (duration * 1000);
    if (t >= 1) { bgm.volume = 0; bgm.pause(); bgm.currentTime = 0; clearInterval(tick); }
    else { bgm.volume = startVol * (1 - t); }
  }, 50);
}

// ---- Config ----
const PADDLE_W = 220;
const PADDLE_H = 24;
const PADDLE_Y = H - 80;
const BALL_R = 16;
const BOSS_R = BALL_R * 7;   // 112px
const BOSS_MAX_HP = 21;
const COLS = 16;
const ROWS = 8;
const BLOCK_W = 88;
const BLOCK_H = 34;
const BLOCK_PAD = 8;
const BLOCK_OFFSET_X = (W - (COLS * (BLOCK_W + BLOCK_PAD) - BLOCK_PAD)) / 2;
const BLOCK_OFFSET_Y = 110;

const ROW_COLORS = ['#ff4466','#ff7733','#ffdd22','#aadd00','#44cc66','#44aaff','#8855ff','#ff44cc'];

// ---- Item System ----
function drawStarShape(cx, cy, outer, inner = outer * 0.42, pts = 5) {
  const step = Math.PI / pts;
  ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = i * step - Math.PI / 2;
    const r = i % 2 === 0 ? outer : inner;
    ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  ctx.closePath();
}

// アイテム定義。後から push するだけで種類を追加できる。
const ITEM_DEFS = [
  {
    id: 'star',
    weight: 2,
    stackable: false,
    effectKey: 'wide_paddle',
    outlineColor: '#ffffff',
    draw(x, y) {
      ctx.save();
      ctx.shadowColor = '#aaddff';
      ctx.shadowBlur = 30;
      drawStarShape(x, y, 18);
      const g = ctx.createRadialGradient(x, y, 0, x, y, 18);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(1, '#aaccff');
      ctx.fillStyle = g;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#88aadd';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    },
    apply(eff) {
      eff['wide_paddle'] = { timer: 420 };
    },
  },
  {
    id: 'meteor',
    weight: 2,
    isBomb: true,
    draw(x, y) {
      const pulse = (Math.sin(Date.now() / 160) + 1) / 2;
      ctx.save();
      ctx.shadowColor = `rgba(255,${Math.floor(60 + pulse * 80)},0,1)`;
      ctx.shadowBlur = 20 + pulse * 24;
      // 本体
      const g = ctx.createRadialGradient(x - 4, y - 4, 2, x, y, 16);
      g.addColorStop(0, '#cc88cc');
      g.addColorStop(0.5, '#440033');
      g.addColorStop(1, '#0a000a');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, 16, 0, Math.PI * 2);
      ctx.fill();
      // 警告クロス
      ctx.strokeStyle = `rgba(255,80,0,${0.5 + pulse * 0.5})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y);
      ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10);
      ctx.stroke();
      ctx.restore();
    },
    apply() {},
  },
  {
    id: 'life_up',
    weight: 1,
    draw(x, y) {
      ctx.save();
      ctx.shadowColor = '#44aaff';
      ctx.shadowBlur = 28;
      const g = ctx.createRadialGradient(x, y - 2, 0, x, y, 18);
      g.addColorStop(0, '#aaddff');
      g.addColorStop(1, '#0055cc');
      ctx.fillStyle = g;
      ctx.beginPath();
      const s = 1.4;
      ctx.moveTo(x, y + 8 * s);
      ctx.bezierCurveTo(x - 10 * s, y,     x - 12 * s, y - 6 * s,  x - 6 * s, y - 8 * s);
      ctx.bezierCurveTo(x - 2  * s, y - 10 * s, x, y - 6 * s,      x,         y - 4 * s);
      ctx.bezierCurveTo(x,          y - 6 * s,  x + 2 * s, y - 10 * s, x + 6 * s, y - 8 * s);
      ctx.bezierCurveTo(x + 12 * s, y - 6 * s, x + 10 * s, y,      x,         y + 8 * s);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    },
    apply() { lives = Math.min(lives + 1, 9); },
  },
  {
    id: 'speed_up',
    weight: 2,
    effectKey: 'speed_up',
    stackable: true,
    draw(x, y) {
      ctx.save();
      ctx.shadowColor = '#44ff88';
      ctx.shadowBlur = 24;
      ctx.fillStyle = '#33ee66';
      ctx.beginPath();
      ctx.moveTo(x,       y - 18);
      ctx.lineTo(x + 14,  y + 2);
      ctx.lineTo(x + 5,   y + 2);
      ctx.lineTo(x + 5,   y + 18);
      ctx.lineTo(x - 5,   y + 18);
      ctx.lineTo(x - 5,   y + 2);
      ctx.lineTo(x - 14,  y + 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    },
    apply(eff) { eff['speed_up'] = { timer: 420 }; },
  },
  {
    id: 'ball_double',
    weight: 2,
    effectKey: 'ball_double',
    stackable: false,
    draw(x, y) {
      ctx.save();
      ctx.shadowColor = '#ff4444';
      ctx.shadowBlur = 24;
      ctx.fillStyle = '#ff3333';
      ctx.font = 'bold 32px Courier New';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('2', x, y);
      ctx.restore();
    },
    apply(eff) { eff['ball_double'] = { timer: 300 }; },
    onCollect() {
      const active = balls.filter(b => !b.onPaddle);
      const clones = active.map(b => ({ ...b, vx: -b.vx }));
      balls.push(...clones);
      if (balls.length > 8) balls.length = 8;
    },
  },
  {
    id: 'pierce_expand',
    weight: 2,
    stackable: true,
    draw(x, y) {
      ctx.save();
      ctx.shadowColor = '#ffee00';
      ctx.shadowBlur = 28;
      ctx.fillStyle = '#ffdd00';
      ctx.beginPath();
      ctx.moveTo(x + 6,  y - 20);
      ctx.lineTo(x - 2,  y - 2);
      ctx.lineTo(x + 7,  y - 2);
      ctx.lineTo(x - 6,  y + 20);
      ctx.lineTo(x + 2,  y + 2);
      ctx.lineTo(x - 7,  y + 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    },
    apply() { bounceStreak += 10; streakAnimTarget += 10; checkStreakBonus(); },
  },
];

function randomItemDef() {
  const total = ITEM_DEFS.reduce((s, d) => s + (d.weight ?? 1), 0);
  let r = Math.random() * total;
  for (const d of ITEM_DEFS) { r -= (d.weight ?? 1); if (r <= 0) return d; }
  return ITEM_DEFS[ITEM_DEFS.length - 1];
}

// ---- State ----
let state; // 'start' | 'play' | 'dead' | 'levelup' | 'over'
let paddle, balls, blocks, lives, level, baseSpeed;
let bounceStreak = 0;
let streakAnimTarget = 0.0;
let streakBarDisplay = 0.0;
let streakWrapDelay = 0;
let stageTime = 0;
let rings = [];
let paddleGlow = 0;
let paddleFreezeTimer = 0;
let freezeTimer = 0;
let screenShake = 0;
let streakBarGlow = 0;
let livesBarHidden = false;
let paddleHidden = false;
let particles = [];
let debris = [];
let pierceZoneWidth = 1;
let pierceZoneBonus = 0;
let items = [];            // 落下中のアイテム
let activeEffects = {};    // { effectId: { timer } }
let debugPierceExpanded = false;
let boss = null;
let deathRing = null;
let bossSlowFrame = 0;
let pausedFrom = 'play';
let keys = {};
let mouseX = W / 2;

function makeBall(onPaddle = true) {
  return { x: W / 2, y: PADDLE_Y - BALL_R - 2, vx: 0, vy: 0, r: BALL_R, onPaddle, pierce: false, pierceTimer: 0 };
}

// ---- Fire Particles ----
function emitFire(x, y, count = 4, white = false) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 1.8 + 0.4;
    particles.push({
      x: x + (Math.random() - 0.5) * BALL_R * 1.2,
      y: y + (Math.random() - 0.5) * BALL_R * 1.2,
      vx: Math.cos(angle) * speed * 0.6,
      vy: Math.sin(angle) * speed - 1.2,
      life: 0.75 + Math.random() * 0.5,
      size: BALL_R * (0.5 + Math.random() * 0.7),
      white,
    });
  }
}

function updateDrawParticles() {
  const next = [];
  for (const p of particles) {
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy -= 0.05;       // 上へ漂う
    p.vx *= 0.97;
    p.life -= 0.035;
    p.size *= 0.955;
    if (p.life <= 0) continue;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
    if (p.white) {
      g.addColorStop(0,   `rgba(255,255,255,${p.life.toFixed(2)})`);
      g.addColorStop(0.35,`rgba(220,230,255,${(p.life*0.75).toFixed(2)})`);
      g.addColorStop(1,   `rgba(180,200,255,0)`);
    } else {
      g.addColorStop(0,   `rgba(255,245,160,${p.life.toFixed(2)})`);
      g.addColorStop(0.35,`rgba(255,120,0,${(p.life*0.75).toFixed(2)})`);
      g.addColorStop(1,   `rgba(200,30,0,0)`);
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    next.push(p);
  }
  particles = next;
}

// ---- Debris Particles ----
function emitDebris(b, pierce) {
  const count = pierce ? 10 + Math.floor(Math.random() * 5) : 5 + Math.floor(Math.random() * 2);
  const cx = b.x + b.w / 2;
  const cy = b.y + b.h / 2;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = pierce ? 7 + Math.random() * 5 : 2 + Math.random() * 2;
    const sz = pierce ? 2 + Math.random() * 2 : 2 + Math.random() * 2;
    debris.push({
      x: cx + (Math.random() - 0.5) * b.w * 0.6,
      y: cy + (Math.random() - 0.5) * b.h * 0.6,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      angle: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * (pierce ? 0.25 : 0.12),
      w: sz, h: sz,
      color: b.color,
      alpha: 1,
      decay: pierce ? 0.018 : 0.032,
      glow: pierce,
    });
  }
}

function updateDrawDebris() {
  const next = [];
  for (const d of debris) {
    d.x += d.vx;
    d.y += d.vy;
    d.vy += 0;
    d.vx *= 0.97;
    d.vy *= 0.97;
    d.angle += d.rotSpeed;
    d.alpha -= d.decay;
    if (d.alpha <= 0) continue;
    ctx.save();
    ctx.globalAlpha = d.alpha;
    if (d.glow) {
      ctx.shadowColor = d.color;
      ctx.shadowBlur = 8;
    }
    ctx.fillStyle = d.color;
    ctx.translate(d.x, d.y);
    ctx.rotate(d.angle);
    ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
    ctx.restore();
    next.push(d);
  }
  debris = next;
}

function launchBall(ball) {
  const angle = -Math.PI / 4 - Math.random() * Math.PI / 4;
  ball.vx = Math.cos(angle) * baseSpeed;
  ball.vy = Math.sin(angle) * baseSpeed;
  ball.onPaddle = false;
}

function resetBallAndPaddle() {
  paddle = { x: W / 2 - PADDLE_W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
  baseSpeed = (9 + (level - 1) * 1.2) * 0.7;
  balls = [makeBall(true)];
  bounceStreak = 0;
  streakAnimTarget = 0;
  streakBarDisplay = 0;
  streakWrapDelay = 0;
  stageTime = 0;
  freezeTimer = 0;
  particles = [];
  pierceZoneWidth = 1;
  livesBarHidden = false;
  paddleHidden = false;
  paddleFreezeTimer = 0;
  items = [];
  activeEffects = {};
}

function initBlocks() {
  blocks = [];
  // ステージごとにランダムで3列を選定
  const cols = Array.from({length: COLS}, (_, i) => i);
  const bossCols = cols.sort(() => Math.random() - 0.5).slice(0, 3);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 1; c < COLS - 1; c++) {
      const isBoss = bossCols.includes(c) && r < ROWS - 1;
      const isItem = Math.random() < (1 / 6);
      const itemDef = isItem ? randomItemDef() : null;
      blocks.push({
        x: BLOCK_OFFSET_X + c * (BLOCK_W + BLOCK_PAD),
        y: BLOCK_OFFSET_Y + r * (BLOCK_H + BLOCK_PAD),
        w: BLOCK_W,
        h: BLOCK_H,
        color: ROW_COLORS[r],
        alive: true,
        isBoss,
        hp: isBoss ? 3 : 1,
        isItem, itemDef,
      });
    }
  }
}

function init() {
  resetBallAndPaddle();
  initBlocks();
}

function reset() {
  lives = 3;
  level = 1;
  boss = null;
  deathRing = null;
  pierceZoneBonus = 0;
  init();
  state = 'start';
}

reset();

// ---- Input ----
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Digit1') {
    if (state === 'play') { blocks.forEach(b => b.alive = false); return; }
    if (state === 'boss' && boss && boss.phase !== 'dying') {
      boss.hp = 0; boss.phase = 'dying'; boss.dyingPhase = 'freeze'; boss.dyingTimer = 25;
      playSound(SE.death); stopBGM(); return;
    }
  }
  if (e.code === 'Digit2') {
    debugPierceExpanded = !debugPierceExpanded;
    return;
  }
  if (e.code === 'Escape') {
    e.preventDefault();
    if (state === 'play' || state === 'boss') { pausedFrom = state; state = 'paused'; pauseAudio(); }
    else if (state === 'paused') { state = pausedFrom; resumeAudio(); }
    return;
  }
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'paused') { state = pausedFrom; resumeAudio(); return; }
    if (state === 'start' || state === 'over') { reset(); state = 'play'; startBGM('normal'); }
    else if (state === 'cleared') { reset(); state = 'start'; }
    else if (state === 'play' || state === 'boss') {
      const onPaddleBall = balls.find(b => b.onPaddle);
      if (onPaddleBall) launchBall(onPaddleBall);
    }
    else if (state === 'dead') { resetBallAndPaddle(); state = boss ? 'boss' : 'play'; }
  }
});
document.addEventListener('keyup', e => keys[e.code] = false);
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
});

// ---- Physics ----
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function movePaddle() {
  if (paddleFreezeTimer > 0) { paddleFreezeTimer--; return; }
  const speed = 14 * (activeEffects['speed_up'] ? 1.5 : 1);
  if (keys['ArrowLeft']  || keys['KeyA']) paddle.x -= speed;
  if (keys['ArrowRight'] || keys['KeyD']) paddle.x += speed;
  paddle.x = clamp(paddle.x, 0, W - paddle.w);
}

function collideBallBlock(ball, b) {
  const bx = ball.x, by = ball.y, r = ball.r;
  if (bx + r < b.x || bx - r > b.x + b.w) return false;
  if (by + r < b.y || by - r > b.y + b.h) return false;

  const overlapL = (bx + r) - b.x;
  const overlapR = (b.x + b.w) - (bx - r);
  const overlapT = (by + r) - b.y;
  const overlapB = (b.y + b.h) - (by - r);
  const minH = Math.min(overlapL, overlapR);
  const minV = Math.min(overlapT, overlapB);

  if (!ball.pierce) {
    if (minH < minV) {
      ball.vx = (overlapL < overlapR) ? -Math.abs(ball.vx) : Math.abs(ball.vx);
    } else {
      ball.vy = (overlapT < overlapB) ? -Math.abs(ball.vy) : Math.abs(ball.vy);
    }
  }
  return true;
}

function checkStreakBonus() {
  if (bounceStreak >= 10) {
    const remainder = bounceStreak % 10;
    bounceStreak = remainder;
    streakBarDisplay = 10;
    streakAnimTarget = 10 + remainder;
    streakWrapDelay = 22; // 満タン表示を約0.35秒キープしてから余剰へ
    pierceZoneBonus += 4;
    paddleGlow = 1.0;
    rings.push({ x: paddle.x + paddle.w / 2, y: paddle.y + paddle.h / 2, r: 0, maxR: 240, alpha: 1 });
    playSound(SE.areaup);
  }
}

function emitBarDebris() {
  // ライブスバー破裂
  for (let i = 0; i < 22; i++) {
    debris.push({
      x: 24 + Math.random() * 220,
      y: 20 + Math.random() * 32,
      vx: (Math.random() - 0.5) * 16,
      vy: -(Math.random() * 10 + 2),
      angle: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.5,
      w: 5 + Math.random() * 9,
      h: 3 + Math.random() * 5,
      color: i % 3 === 0 ? '#ff6688' : '#ff2244',
      alpha: 1.0,
      decay: 0.018 + Math.random() * 0.012,
      glow: false,
    });
  }
  // パドル破裂
  for (let i = 0; i < 28; i++) {
    debris.push({
      x: paddle.x + Math.random() * paddle.w,
      y: paddle.y + Math.random() * paddle.h,
      vx: (Math.random() - 0.5) * 18,
      vy: -(Math.random() * 12 + 2),
      angle: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.6,
      w: 6 + Math.random() * 12,
      h: 4 + Math.random() * 6,
      color: i % 3 === 0 ? '#99ccff' : i % 3 === 1 ? '#3366cc' : '#aaddff',
      alpha: 1.0,
      decay: 0.015 + Math.random() * 0.01,
      glow: false,
    });
  }
  bounceStreak = 0;
  streakAnimTarget = 0;
  streakBarDisplay = 0;
  streakWrapDelay = 0;
  livesBarHidden = true;
  paddleHidden = true;
}

function updateBalls() {
  if (state !== 'dead') stageTime++;
  // 60秒で約1.5倍、最大2.5倍にキャップ
  const speedMult = Math.min(1 + stageTime * 0.000140, 2.5);

  // Keep on-paddle ball stuck to paddle
  const onPaddleBall = balls.find(b => b.onPaddle);
  if (onPaddleBall) {
    onPaddleBall.x = paddle.x + paddle.w / 2;
    onPaddleBall.y = PADDLE_Y - onPaddleBall.r - 2;
  }

  const toRemove = [];
  const toAdd = [];

  for (const ball of balls) {
    if (ball.onPaddle) continue;

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Wall bounces
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); playWall(); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); playWall(); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); playWall(); }

    // 経過時間による速度スケール（方向を保ちつつ速さだけ調整）
    const currentSpeed = Math.hypot(ball.vx, ball.vy);
    const targetSpeed = baseSpeed * speedMult;
    if (currentSpeed > 0 && Math.abs(currentSpeed - targetSpeed) > 0.05) {
      ball.vx = ball.vx / currentSpeed * targetSpeed;
      ball.vy = ball.vy / currentSpeed * targetSpeed;
    }

    // Paddle collision
    if (
      ball.vy > 0 &&
      ball.y + ball.r >= paddle.y &&
      ball.y - ball.r <= paddle.y + paddle.h &&
      ball.x >= paddle.x &&
      ball.x <= paddle.x + paddle.w
    ) {
      const rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const angle = rel * (Math.PI / 3);
      const speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.abs(Math.cos(angle) * speed);
      ball.y = paddle.y - ball.r - 1;
      const isPierceHit = Math.abs(ball.x - (paddle.x + paddle.w / 2)) <= pierceZoneWidth;
      playPaddle(isPierceHit);

      // 中央2px ヒット判定 → フリーズ＋貫通モード
      if (isPierceHit) {
        freezeTimer = 12; // ~0.2秒 (60fps)
        ball.pierce = true;
        ball.pierceTimer = 360; // 約6秒
        emitFire(ball.x, ball.y, 20);
      }

      bounceStreak++;
      streakAnimTarget++;
      checkStreakBonus();
    }

    // Block collisions
    for (const b of blocks) {
      if (!b.alive) continue;
      if (collideBallBlock(ball, b)) {
        b.hp--;
        playBlock(ball.pierce);
        if (b.hp <= 0) {
          b.alive = false;
          emitDebris(b, ball.pierce);
          if (b.isItem && b.itemDef) {
            items.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vy: b.itemDef.isBomb ? 1.2 : 2.4, def: b.itemDef });
            b.isItem = false;
          }
        }
        break;
      }
    }

    // 貫通モード: 炎を放出 / タイマー減算
    if (ball.pierce) {
      emitFire(ball.x, ball.y, 3);
      ball.pierceTimer--;
      if (ball.pierceTimer <= 0) ball.pierce = false;
    }

    // Lost ball
    if (ball.y - ball.r > H) {
      toRemove.push(ball);
    }
  }

  balls = balls.filter(b => !toRemove.includes(b));
  balls.push(...toAdd);

  // ミス: 全ボールが消えた
  if (balls.length === 0) {
    playMiss();
    lives--;
    bounceStreak = 0;
    streakAnimTarget = 0;
    streakBarDisplay = 0;
    streakWrapDelay = 0;
    if (lives <= 0) { state = 'over'; stopBGM(); }
    else { state = 'dead'; }
    return;
  }

  // Level clear → boss fight
  if (state === 'play' && blocks.every(b => !b.alive)) {
    state = 'boss';
    spawnBoss();
  }
}

// ---- Draw helpers ----
function drawBlock(b) {
  if (b.spawnAlpha !== undefined && b.spawnAlpha < 1) {
    ctx.globalAlpha = b.spawnAlpha;
    b.spawnAlpha = Math.min(1, b.spawnAlpha + 0.05);
  }
  const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  if (b.isBoss) {
    grad.addColorStop(0, desaturate(b.color, 0.78, -20));
    grad.addColorStop(1, desaturate(b.color, 0.78, -50));
  } else {
    grad.addColorStop(0, lighten(b.color, 40));
    grad.addColorStop(1, b.color);
  }
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(b.x, b.y, b.w, b.h, 7);
  ctx.fill();
  // shine
  ctx.fillStyle = b.isBoss ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.12)';
  ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 5);
  // ひび割れ
  if (b.isBoss && b.hp < 3) drawCracks(b);
  ctx.globalAlpha = 1;
}

function drawCracks(b) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  // ブロック位置をシードにした疑似乱数で形状を固定
  const s = (b.x * 31 + b.y * 17) % 100 / 100;
  const dmg = 3 - b.hp; // 1 or 2

  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  // 1本目: 中心から斜め
  const a1 = s * Math.PI * 2;
  const l1 = 9 + s * 7;
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(a1) * l1, cy + Math.sin(a1) * l1);
  // 枝
  const a2 = a1 + 0.55 + s * 0.4;
  ctx.moveTo(cx + Math.cos(a1) * l1 * 0.5, cy + Math.sin(a1) * l1 * 0.5);
  ctx.lineTo(cx + Math.cos(a2) * l1 * 0.65, cy + Math.sin(a2) * l1 * 0.65);
  ctx.stroke();

  if (dmg >= 2) {
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.beginPath();
    // 2本目: 反対方向
    const a3 = a1 + Math.PI * 0.75;
    const l3 = 13 + s * 5;
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a3) * l3, cy + Math.sin(a3) * l3);
    // 枝
    const a4 = a3 - 0.45;
    ctx.moveTo(cx + Math.cos(a3) * l3 * 0.45, cy + Math.sin(a3) * l3 * 0.45);
    ctx.lineTo(cx + Math.cos(a4) * l3 * 0.75, cy + Math.sin(a4) * l3 * 0.75);
    // 3本目: 短い横ひび
    const a5 = a1 + Math.PI * 1.4 + s * 0.3;
    ctx.moveTo(cx - 4, cy + 3);
    ctx.lineTo(cx - 4 + Math.cos(a5) * 11, cy + 3 + Math.sin(a5) * 11);
    ctx.stroke();
  }
  ctx.restore();
}

function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 0xff) + amt, 0, 255);
  const g = clamp(((n >> 8) & 0xff) + amt, 0, 255);
  const b = clamp((n & 0xff) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function desaturate(hex, t, adj = 0) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 0xff, g = (n >> 8) & 0xff, b = n & 0xff;
  const lum = r * 0.30 + g * 0.59 + b * 0.11;
  const nr = clamp(Math.round(r + (lum - r) * t) + adj, 0, 255);
  const ng = clamp(Math.round(g + (lum - g) * t) + adj, 0, 255);
  const nb = clamp(Math.round(b + (lum - b) * t) + adj, 0, 255);
  return `rgb(${nr},${ng},${nb})`;
}

function drawPaddle() {
  if (paddleHidden) return;
  // 発光エフェクト
  if (paddleGlow > 0) {
    ctx.save();
    ctx.shadowColor = `rgba(100, 220, 255, ${paddleGlow})`;
    ctx.shadowBlur = 60 * paddleGlow;
    ctx.fillStyle = `rgba(100, 220, 255, ${paddleGlow * 0.25})`;
    ctx.beginPath();
    ctx.roundRect(paddle.x - 12, paddle.y - 8, paddle.w + 24, paddle.h + 16, 18);
    ctx.fill();
    ctx.restore();
    paddleGlow = Math.max(0, paddleGlow - 0.017); // 約60fpsで1秒かけて減衰
  }

  // フリーズ中: 青紫点滅グロー
  if (paddleFreezeTimer > 0) {
    const t = 180 - paddleFreezeTimer; // 経過フレーム（0→180）
    const phase = 0.08 * t + t * t / 900; // 周波数が線形に増加する位相
    const pulse = 0.5 + 0.5 * Math.sin(phase);
    ctx.save();
    ctx.shadowColor = '#aa44ff';
    ctx.shadowBlur = 40 * pulse;
    ctx.strokeStyle = `rgba(180, 100, 255, ${0.6 + 0.4 * pulse})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 10);
    ctx.stroke();
    ctx.restore();
  }

  const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
  if (boss && boss.phase === 'dying') {
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(1, '#ccddff');
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 30;
  } else if (paddleFreezeTimer > 0) {
    grad.addColorStop(0, '#cc88ff');
    grad.addColorStop(1, '#7722cc');
  } else if (paddleGlow > 0) {
    grad.addColorStop(0, `rgba(180, 240, 255, 1)`);
    grad.addColorStop(1, `rgba(80, 180, 255, 1)`);
  } else {
    grad.addColorStop(0, '#99ccff');
    grad.addColorStop(1, '#3366cc');
  }
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 10);
  ctx.fill();
}

function updateEffects() {
  for (const id in activeEffects) {
    activeEffects[id].timer--;
    if (activeEffects[id].timer <= 0) delete activeEffects[id];
  }
  // パドル幅
  let wMult = 1;
  if (activeEffects['wide_paddle'])   wMult *= 2;
  if (activeEffects['narrow_paddle']) wMult *= 0.5;
  const newW = Math.round(PADDLE_W * wMult);
  const cx = paddle.x + paddle.w / 2;
  paddle.w = newW;
  paddle.x = clamp(cx - newW / 2, 0, W - newW);
  // 貫通エリア幅 (デバッグ優先)
  if (debugPierceExpanded) {
    pierceZoneWidth = Math.floor(paddle.w / 2);
  } else if (activeEffects['narrow_paddle']) {
    pierceZoneWidth = 12 + pierceZoneBonus;
  } else {
    pierceZoneWidth = 2 + pierceZoneBonus;
  }
}

function spawnBombExplosion(x, y) {
  rings.push({ x, y, r: 0, maxR: BALL_R * 3, alpha: 1.0, color: '255, 80, 200' });
  emitFire(x, y, 15, true);
  screenShake = 18;
  playSound(SE.bomb01);
}

function updateItems() {
  const next = [];
  for (const item of items) {
    item.y += item.vy;
    // 爆弾アイテム: パドル衝突で即爆発・ライフ-1
    if (item.def.isBomb) {
      if (
        item.y + 16 >= paddle.y && item.y - 16 <= paddle.y + paddle.h &&
        item.x >= paddle.x      && item.x <= paddle.x + paddle.w
      ) {
        paddleFreezeTimer = 180; // 約3秒停止
        spawnBombExplosion(item.x, item.y);
      } else if (item.y - 16 <= H) {
        next.push(item);
      }
      continue;
    }
    // 通常アイテム: パドル衝突で取得
    if (
      item.y + 10 >= paddle.y && item.y - 10 <= paddle.y + paddle.h &&
      item.x >= paddle.x      && item.x <= paddle.x + paddle.w
    ) {
      if (item.def.stackable === false && activeEffects[item.def.effectKey]) continue; // 重複不可
      item.def.apply(activeEffects);
      if (item.def.onCollect) item.def.onCollect();
      playSound(SE.item);
      paddleGlow = Math.min((paddleGlow || 0) + 0.6, 1.0);
      if (item.def.id === 'pierce_expand') playSound(SE.areaup);
      continue; // 回収
    }
    if (item.y - 10 <= H) next.push(item);
  }
  items = next;
}

function drawItems() {
  for (const item of items) {
    item.def.draw(item.x, item.y);
  }
}

function drawPierceZone() {
  if (paddleHidden) return;
  const cx = paddle.x + paddle.w / 2;
  const zw = Math.max(pierceZoneWidth, 1);

  // 外側グロー（視認性のためゾーン幅より広めに表示）
  const glowW = zw * 2 + 8;
  ctx.save();
  ctx.shadowColor = '#ffaa00';
  ctx.shadowBlur = 14 + zw * 2;
  const grad = ctx.createLinearGradient(cx - glowW, paddle.y, cx + glowW, paddle.y);
  grad.addColorStop(0,   'rgba(255,180,0,0)');
  grad.addColorStop(0.3, 'rgba(255,220,60,0.55)');
  grad.addColorStop(0.5, 'rgba(255,255,160,0.95)');
  grad.addColorStop(0.7, 'rgba(255,220,60,0.55)');
  grad.addColorStop(1,   'rgba(255,180,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(cx - glowW, paddle.y - 1, glowW * 2, paddle.h + 2);
  ctx.restore();

  // 中央の細いハイライト線（実際の判定幅）
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = 0.9;
  ctx.fillRect(cx - zw, paddle.y, zw * 2, paddle.h);
  ctx.restore();
}

function drawRings() {
  for (const ring of rings) {
    ctx.beginPath();
    ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${ring.color || '100, 220, 255'}, ${ring.alpha})`;
    ctx.lineWidth = 5 * ring.alpha;
    ctx.stroke();
    // 拡大 & フェード
    ring.r += (ring.maxR - ring.r) * 0.12;
    ring.alpha -= 0.025;
  }
  rings = rings.filter(r => r.alpha > 0);
}

function drawBall(ball) {
  if (boss && boss.phase === 'dying') {
    ctx.save();
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }
  if (ball.pierce) {
    // 炎オーラ
    const aura = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.r * 2.8);
    aura.addColorStop(0,   'rgba(255,240,120,0.7)');
    aura.addColorStop(0.35,'rgba(255,110,0,0.45)');
    aura.addColorStop(0.7, 'rgba(200,30,0,0.2)');
    aura.addColorStop(1,   'rgba(180,0,0,0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r * 2.8, 0, Math.PI * 2);
    ctx.fill();
    // コア
    const core = ctx.createRadialGradient(ball.x - 1, ball.y - 1, 0, ball.x, ball.y, ball.r);
    core.addColorStop(0,  '#ffffff');
    core.addColorStop(0.4,'#ffee88');
    core.addColorStop(1,  '#ff6600');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  } else {
    const grad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, ball.r);
    grad.addColorStop(0,   '#ffffff');
    grad.addColorStop(0.5, '#aaddff');
    grad.addColorStop(1,   '#3388ff');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawHUD() {
  if (!livesBarHidden) {
    ctx.fillStyle = '#aabbcc';
    ctx.font = '26px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText(`LIVES: ${'♥ '.repeat(lives)}`, 24, 42);
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = '#556688';
  ctx.fillText(`LEVEL ${level}`, W / 2, 42);

  // ストリークバー (画面下部)
  streakBarGlow = Math.max(0, streakBarGlow - 0.03);

  // アニメーション: streakBarDisplay を streakAnimTarget に向けて進める
  if (streakWrapDelay > 0) {
    // 満タン表示キープ中: バーを 10 に固定してラップしない
    streakWrapDelay--;
    streakBarDisplay = 10;
  } else {
    if (streakBarDisplay < streakAnimTarget) {
      streakBarDisplay = Math.min(streakBarDisplay + 0.35, streakAnimTarget);
    }
    // 10 を超えたら折り返し（視覚的ラップ）
    while (streakBarDisplay >= 10) {
      streakBarDisplay -= 10;
      streakAnimTarget  -= 10;
    }
  }

  const barW = 400;
  const barH = 10;
  const bx = W / 2 - barW / 2;
  const by = H - 26;
  ctx.fillStyle = '#223';
  ctx.fillRect(bx, by, barW, barH);
  const fill = (streakBarDisplay / 10) * barW;
  const barColor = streakBarDisplay >= 9.5 ? '#ffdd22' : '#44aaff';
  ctx.fillStyle = barColor;
  ctx.fillRect(bx, by, fill, barH);
  ctx.fillStyle = '#556688';
  ctx.font = '20px Courier New';
  ctx.fillText(`STREAK ${Math.floor(streakBarDisplay)}/10`, W / 2, H - 34);
}

const ITEM_DESCRIPTIONS = {
  star:          ['パドル幅 ×2',       'パドルが広がる  (7秒)'],
  meteor:        ['危険！ 爆弾',        '爆発に触れると一定時間動けなくなる'],
  life_up:       ['ライフ +1',         '最大9まで回復'],
  speed_up:      ['パドル速度 ×1.5',   '重複可  (7秒)'],
  ball_double:   ['ボール ×2',         'ボール数を倍に  上限8個'],
  pierce_expand: ['ストリーク +10',     'STREAKを一気に進める'],
};

function drawPauseScreen() {
  ctx.fillStyle = 'rgba(5,5,15,0.82)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.shadowColor = '#4466ff';
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#88aaff';
  ctx.font = 'bold 88px Courier New';
  ctx.fillText('PAUSE', W / 2, 170);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#6677aa';
  ctx.font = '30px Courier New';
  ctx.fillText('─── アイテム一覧 ───', W / 2, 260);

  const cols = [W / 2 - 560, W / 2 + 40];
  const startY = 390;
  const rowH = 130;

  ITEM_DEFS.forEach((def, i) => {
    const col = cols[i % 2];
    const y = startY + Math.floor(i / 2) * rowH;
    const iconX = col + 34;

    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.beginPath();
    ctx.arc(iconX, y, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    def.draw(iconX, y);

    const desc = ITEM_DESCRIPTIONS[def.id];
    ctx.textAlign = 'left';
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#e8eeff';
    ctx.font = 'bold 26px Courier New';
    ctx.fillText(desc[0], col + 82, y - 12);
    ctx.fillStyle = '#7788aa';
    ctx.font = '21px Courier New';
    ctx.fillText(desc[1], col + 82, y + 20);
  });

  // ゲームシステム説明
  const sysY = startY + Math.ceil(ITEM_DEFS.length / 2) * rowH + 30;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#6677aa';
  ctx.font = '28px Courier New';
  ctx.fillText('─── ゲームシステム ───', W / 2, sysY);

  const sysItems = [
    ['STREAK', '10回連続でパドルに当てると貫通弾発生エリアが拡張される'],
    ['貫通弾',  'パドル中央の黄色ゾーンに当てると約6秒間ブロック貫通属性が付与'],
  ];
  sysItems.forEach(([label, desc], i) => {
    const sy = sysY + 52 + i * 52;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#e8eeff';
    ctx.font = 'bold 24px Courier New';
    ctx.fillText(label, W / 2 - 10, sy);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#7788aa';
    ctx.font = '22px Courier New';
    ctx.fillText(desc, W / 2 + 10, sy);
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#445566';
  ctx.font = '26px Courier New';
  ctx.fillText('ESC またはスペースキーで再開', W / 2, H - 30);
}

function drawOverlay(lines, sub) {
  ctx.fillStyle = 'rgba(5,5,15,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#88aaff';
  ctx.font = 'bold 88px Courier New';
  ctx.fillText(lines[0], W / 2, H / 2 - 40);
  if (lines[1]) {
    ctx.fillStyle = '#ffffff';
    ctx.font = '42px Courier New';
    ctx.fillText(lines[1], W / 2, H / 2 + 48);
  }
  if (sub) {
    ctx.fillStyle = '#556688';
    ctx.font = '26px Courier New';
    ctx.fillText(sub, W / 2, H / 2 + 120);
  }
}

// ---- Boss ----
function spawnBoss() {
  boss = {
    x: W / 2, y: 280,
    t: 0,
    hp: BOSS_MAX_HP,
    phase: 'patrol',
    laserCooldown: 260,
    laserX: W / 2,
    chargeTimer: 0,
    laserTimer: 0,
    laserHitDone: false,
    dyingTimer: 0,
    hitFlash: 0,
    blockSpawnTimer: 240 + Math.floor(Math.random() * 180),
  };
  startBGM('boss');
}

function spawnBossBlock() {
  const activeSpawned = blocks.filter(b => b.alive && b.spawned).length;
  if (activeSpawned >= 3) return;
  let x, y, attempts = 0;
  do {
    x = BLOCK_OFFSET_X + Math.random() * (W - BLOCK_OFFSET_X * 2 - BLOCK_W);
    y = 520 + Math.random() * 340;
    attempts++;
  } while (attempts < 20 && blocks.some(b => b.alive &&
    Math.abs(b.x - x) < BLOCK_W + 10 && Math.abs(b.y - y) < BLOCK_H + 10));
  const color = ROW_COLORS[Math.floor(Math.random() * ROW_COLORS.length)];
  const itemDef = randomItemDef();
  blocks.push({
    x, y, w: BLOCK_W, h: BLOCK_H,
    color, alive: true,
    isBoss: false, hp: 1,
    isItem: true, itemDef,
    spawned: true, spawnAlpha: 0,
  });
  rings.push({ x: x + BLOCK_W / 2, y: y + BLOCK_H / 2, r: 0, maxR: 140, alpha: 1, color: '255, 200, 80' });
}

function updateBoss() {
  if (!boss) return;

  if (boss.hitFlash > 0) boss.hitFlash--;

  if (boss.phase === 'dying') {
    if (boss.dyingPhase === 'freeze') {
      // 画面停止・ボス白化
      boss.dyingTimer--;
      if (boss.dyingTimer <= 0) {
        boss.dyingPhase = 'explode';
        boss.dyingTimer = 150;
      }
      return;
    }
    if (boss.dyingPhase === 'explode') {
      // 連続爆発（2フレームに1回だけ進むスロー演出）
      bossSlowFrame++;
      if (bossSlowFrame % 2 !== 0) return;
      boss.dyingTimer--;
      screenShake = 22;
      if (Math.random() < 0.7) {
        const ex = boss.x + (Math.random() - 0.5) * BOSS_R * 2.8;
        const ey = boss.y + (Math.random() - 0.5) * BOSS_R * 2.8;
        emitFire(ex, ey, 10, true);
        rings.push({ x: ex, y: ey, r: 0, maxR: 60 + Math.random() * 70, alpha: 0.9, color: '255, 255, 255' });
      }
      if (Math.random() < 0.15) playSound(SE.bomb01);
      if (boss.dyingTimer <= 0) {
        bossSlowFrame = 0;
        boss.dyingPhase = 'ring';
        boss.dyingTimer = 90;
        deathRing = { x: boss.x, y: boss.y, r: 0, maxR: Math.hypot(W, H) + 60 };
        playSound(SE.bomb02);
      }
      return;
    }
    if (boss.dyingPhase === 'ring') {
      // 白リング拡大
      boss.dyingTimer--;
      deathRing.r += deathRing.maxR / 90;
      if (boss.dyingTimer <= 0) {
        boss = null;
        deathRing = null;
        state = 'cleared';
        playSound(SE.clear);
      }
      return;
    }
  }

  // 横倒し8の字 (リサジュー 1:2)
  boss.t += 0.008;
  boss.x = W / 2 + 530 * Math.cos(boss.t);
  boss.y = 280 + 140 * Math.sin(2 * boss.t);

  // ボス戦中のブロックスポーン
  boss.blockSpawnTimer--;
  if (boss.blockSpawnTimer <= 0) {
    boss.blockSpawnTimer = 240 + Math.floor(Math.random() * 180);
    spawnBossBlock();
  }

  if (boss.phase === 'patrol') {
    boss.laserCooldown--;
    if (boss.laserCooldown <= 0) {
      boss.phase = 'charge';
      boss.chargeTimer = 90;
      boss.laserHitDone = false;
      boss.laserX = boss.x;
      playCharge();
    }
  } else if (boss.phase === 'charge') {
    boss.laserX = boss.x;
    boss.chargeTimer--;
    if (boss.chargeTimer <= 0) {
      boss.phase = 'laser';
      boss.laserTimer = 60;
      playLaser();
    }
  } else if (boss.phase === 'laser') {
    boss.laserX = boss.x;
    if (!boss.laserHitDone) {
      const lw = 8 + 28 * (boss.laserTimer / 60);
      if (paddle.x < boss.laserX + lw && paddle.x + paddle.w > boss.laserX - lw) {
        boss.laserHitDone = true;
        lives--;
        emitBarDebris();
        playMiss();
        if (lives <= 0) { boss = null; state = 'over'; stopBGM(); }
        else { state = 'dead'; }
        return;
      }
    }
    boss.laserTimer--;
    if (boss.laserTimer <= 0) {
      boss.phase = 'patrol';
      boss.laserCooldown = 300 + Math.floor(Math.random() * 180);
    }
  }

  // ボールとの衝突 (dying中はスキップ)
  for (const ball of balls) {
    if (ball.onPaddle) continue;
    if (ball.bossHitCooldown > 0) ball.bossHitCooldown--;
    const dx = ball.x - boss.x, dy = ball.y - boss.y;
    const dist = Math.hypot(dx, dy);
    if (dist < ball.r + BOSS_R && dist > 0) {
      if (ball.pierce) {
        // 貫通: 方向不問・約0.1秒間隔でダメージ
        if (!ball.bossHitCooldown) {
          ball.bossHitCooldown = 6;
          boss.hp--;
          boss.hitFlash = 8;
          screenShake = 14;
          playBlock();
          if (boss.hp <= 0 && boss.phase !== 'dying') {
            boss.phase = 'dying'; boss.dyingPhase = 'freeze'; boss.dyingTimer = 25;
            playSound(SE.death); stopBGM();
          }
        }
      } else {
        // 通常: バウンド
        const nx = dx / dist, ny = dy / dist;
        const dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) {
          ball.vx -= 2 * dot * nx;
          ball.vy -= 2 * dot * ny;
          const overlap = ball.r + BOSS_R - dist;
          ball.x += nx * overlap;
          ball.y += ny * overlap;
          boss.hp--;
          boss.hitFlash = 8;
          screenShake = 14;
          playBlock();
          if (boss.hp <= 0 && boss.phase !== 'dying') {
            boss.phase = 'dying'; boss.dyingPhase = 'freeze'; boss.dyingTimer = 25;
            playSound(SE.death); stopBGM();
          }
        }
      }
    }
  }
}

function drawBoss() {
  if (!boss) return;
  const { x, y } = boss;

  // チャージ: 警告ライン
  if (boss.phase === 'charge') {
    const a = 0.25 + 0.25 * Math.sin(Date.now() * 0.012);
    ctx.save();
    ctx.strokeStyle = `rgba(255,80,80,${a})`;
    ctx.lineWidth = 12;
    ctx.setLineDash([24, 16]);
    ctx.beginPath();
    ctx.moveTo(boss.laserX, y + BOSS_R);
    ctx.lineTo(boss.laserX, H);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // レーザービーム（時間とともに細くなる）
  if (boss.phase === 'laser') {
    const lw = 8 + 28 * (boss.laserTimer / 60);
    ctx.save();
    ctx.shadowColor = '#ff6600';
    ctx.shadowBlur = 40 + 30 * (boss.laserTimer / 60);
    const lg = ctx.createLinearGradient(boss.laserX - lw, 0, boss.laserX + lw, 0);
    lg.addColorStop(0,    'rgba(255, 80,  0, 0)');
    lg.addColorStop(0.25, 'rgba(255,160, 40, 0.85)');
    lg.addColorStop(0.5,  'rgba(255,255,180, 1.0)');
    lg.addColorStop(0.75, 'rgba(255,160, 40, 0.85)');
    lg.addColorStop(1,    'rgba(255, 80,  0, 0)');
    ctx.fillStyle = lg;
    ctx.fillRect(boss.laserX - lw, y + BOSS_R, lw * 2, H - (y + BOSS_R));
    ctx.restore();
  }

  // 本体
  ctx.save();
  if (boss.phase === 'dying') {
    if (boss.dyingPhase === 'freeze') {
      // 真っ白
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 40;
      ctx.beginPath();
      ctx.arc(x, y, BOSS_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return;
    }
    if (boss.dyingPhase === 'explode' || boss.dyingPhase === 'ring') {
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 40;
      ctx.beginPath();
      ctx.arc(x, y, BOSS_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return;
    }
  }

  const isCharge = boss.phase === 'charge';
  ctx.shadowColor = boss.hitFlash > 0 ? '#ffffff' : (isCharge ? '#ff4444' : '#cc44ff');
  ctx.shadowBlur  = boss.hitFlash > 0 ? 80 : 40;

  const bg = ctx.createRadialGradient(x - BOSS_R*0.3, y - BOSS_R*0.3, BOSS_R*0.08, x, y, BOSS_R);
  if (boss.hitFlash > 0) {
    bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, '#aaaaaa');
  } else if (isCharge) {
    bg.addColorStop(0, '#ff9999'); bg.addColorStop(0.5, '#cc2222'); bg.addColorStop(1, '#550000');
  } else {
    bg.addColorStop(0, '#ee99ff'); bg.addColorStop(0.5, '#9922cc'); bg.addColorStop(1, '#1a0033');
  }
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(x, y, BOSS_R, 0, Math.PI * 2);
  ctx.fill();

  // 目
  ctx.shadowBlur = 0;
  [[-0.28, -0.18], [0.28, -0.18]].forEach(([ex, ey]) => {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x + ex*BOSS_R, y + ey*BOSS_R, BOSS_R*0.16, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = isCharge ? '#ff0000' : '#3300aa';
    ctx.beginPath();
    ctx.arc(x + ex*BOSS_R, y + ey*BOSS_R, BOSS_R*0.09, 0, Math.PI*2);
    ctx.fill();
  });

  ctx.restore();

  // 体力低下時の赤い点滅
  const ratio = boss.hp / BOSS_MAX_HP;
  if (boss.phase !== 'dying' && ratio < 0.6) {
    const t = Date.now() / 1000;
    const freq = 1.5 + (1 - ratio / 0.6) * 6;  // HP低下で高速化 (1.5→7.5Hz)
    const maxAlpha = (1 - ratio / 0.6) * 0.52;  // HP低下で強く
    const pulse = (Math.sin(t * freq * Math.PI * 2) + 1) / 2;
    ctx.save();
    ctx.shadowColor = '#ff6600';
    ctx.shadowBlur = 80 * pulse;
    ctx.globalAlpha = pulse * maxAlpha;
    ctx.fillStyle = '#ff7700';
    ctx.beginPath();
    ctx.arc(boss.x, boss.y, BOSS_R * 1.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ---- Main loop ----
function loop() {
  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake * 1.5, (Math.random() - 0.5) * screenShake * 1.5);
    screenShake--;
  }
  drawBackground();

  if (state === 'play' || state === 'boss' || state === 'dead') {
    if (state !== 'dead' && !(boss && boss.phase === 'dying')) movePaddle();
    if (state === 'play' || state === 'boss') {
      updateEffects();
      const bossFrozen = boss && boss.phase === 'dying';
      if (freezeTimer > 0) {
        freezeTimer--;
        if (boss && boss.phase === 'dying') updateBoss();
      } else if (bossFrozen) {
        updateBoss();
      } else {
        updateBalls();
        if (state === 'boss') updateBoss();
        updateItems();
      }
    }

    for (const b of blocks) if (b.alive) drawBlock(b);
    drawItems();
    drawRings();
    updateDrawParticles();
    updateDrawDebris();
    drawPaddle();
    drawPierceZone();
    for (const ball of balls) drawBall(ball);
    if (boss) drawBoss();
    if (deathRing) {
      ctx.save();
      const fillAlpha = Math.min(deathRing.r / (deathRing.maxR * 0.65), 1.0);
      ctx.fillStyle = `rgba(255,255,255,${fillAlpha})`;
      ctx.beginPath();
      ctx.arc(deathRing.x, deathRing.y, deathRing.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    drawHUD();

    // フリーズ中のオレンジフラッシュ
    if (freezeTimer > 0) {
      ctx.fillStyle = `rgba(255,120,0,${(freezeTimer / 6) * 0.28})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state === 'dead') {
      drawOverlay(['MISS!'], `残り ${lives} 機　スペースキーで再開`);
    }
  } else if (state === 'paused') {
    for (const b of blocks) if (b.alive) drawBlock(b);
    drawPaddle();
    for (const ball of balls) drawBall(ball);
    if (boss) drawBoss();
    drawHUD();
    drawPauseScreen();
  } else if (state === 'start') {
    drawOverlay(['BLOCK', 'BREAKER'], 'スペースキーでスタート');
    // キー操作説明
    const keys = [
      ['← →  /  A D', 'パドル移動'],
      ['SPACE',        'ボール発射'],
      ['ESC',          '一時停止 / 再開'],
    ];
    const kx = W / 2;
    const ky0 = H / 2 + 210;
    const lineH = 44;
    ctx.font = '22px Courier New';
    keys.forEach((row, i) => {
      const y = ky0 + i * lineH;
      ctx.textAlign = 'right';
      ctx.fillStyle = '#88bbff';
      ctx.fillText(row[0], kx - 18, y);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#aaccee';
      ctx.fillText(row[1], kx + 18, y);
    });
  } else if (state === 'cleared') {
    drawOverlay(['BOSS DEFEATED!', 'CONGRATULATIONS!!'], 'スペースキーでタイトルへ');
  } else if (state === 'over') {
    drawOverlay(['GAME OVER'], 'スペースキーでリスタート');
  }

  ctx.restore();
  requestAnimationFrame(loop);
}

loop();

// ---- Volume Controls ----
document.getElementById('vol-bgm').addEventListener('input', function() {
  document.getElementById('val-bgm').textContent = this.value;
  const v = this.value / 100;
  BGM.normal.volume = v;
  BGM.boss.volume = v * 0.65;
  if (currentBGM) currentBGM.volume = currentBGM === BGM.boss ? v * 0.65 : v;
});

document.getElementById('vol-se').addEventListener('input', function() {
  document.getElementById('val-se').textContent = this.value;
  const v = this.value / 100;
  for (const s of Object.values(SE)) s.volume = v;
});
